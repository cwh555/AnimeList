name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export npm dependencies
        run: |
          tar -czf /tmp/animelist-npm-dependencies.tar.gz node_modules -C "$HOME" .npm
      - name: Upload npm dependencies
        uses: actions/upload-artifact@v4
        with:
          name: animelist-npm-dependencies
          path: /tmp/animelist-npm-dependencies.tar.gz
          retention-days: 1
      - run: npm run check
      - run: npm run release:check
