name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee masterpiece-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masterpiece-filter-check-log-final
          path: masterpiece-check.log
      - run: npm run release:check
