name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full checks in UTC
        run: TZ=UTC npm run check
      - name: Run full tests in Asia/Taipei
        run: TZ=Asia/Taipei npm test
      - name: Run segmented-date keyboard flow in Chromium
        run: npm run test:browser:date
      - name: Run responsive mobile layout in Chromium
        run: npm run test:browser:mobile
      - name: Run media note Reading View rails in Chromium
        run: ANIMELIST_REQUIRE_CHROMIUM=1 node scripts/check-note-reading-rails.mjs
      - name: Run Score Dashboard mobile interactions in Chromium
        run: npm run test:browser:score-mobile
      - name: Run tag chip interactions in Chromium
        run: npm run test:browser:tags
      - name: Run tag manager interactions in Chromium
        run: npm run test:browser:tag-manager
      - run: npm run release:check
