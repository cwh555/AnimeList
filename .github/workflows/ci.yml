name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture picker tests
        shell: bash
        run: |
          set +e
          npm test > picker-test.log 2>&1
          status=$?
          cat picker-test.log
          exit "$status"
      - name: Upload picker test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: picker-test-log
          path: picker-test.log
          retention-days: 1
