name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run lint with diagnostics
        run: npm run lint 2>&1 | tee lint.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classification-lint-diagnostics
          path: lint.log
          retention-days: 1
      - run: npm test
      - run: npm run community:check
      - run: npm run build
      - run: npm run release:check
