name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/search-cover-stability
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply isolated feature integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/validate-search-cover-stability.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          Path('/tmp/apply-feature.py').write_text(script)
          subprocess.run(['python', '/tmp/apply-feature.py'], check=True)

          clean_settings = subprocess.check_output(
              ['git', 'show', 'b78086950de3371882c4b5b072553e28f3efa76e:src/settings.ts'],
              text=True,
          ).replace('import "./search-pagination";\n', '')
          Path('src/settings.ts').write_text(clean_settings)

          main_path = Path('src/main.ts')
          main = main_path.read_text()
          replacements = [
              (
                  'const items = asArray(payload.data).map((subject) => normalizeBangumiSubject(subject, mediaType));',
                  'const items: ExternalMediaResult[] = asArray(payload.data)\n      .map((subject) => normalizeBangumiSubject(subject, mediaType) as ExternalMediaResult);',
              ),
              (
                  'items: media.map((item) => normalizeAniListMedia(item, mediaType)),',
                  'items: media.map((item) => normalizeAniListMedia(item, mediaType) as ExternalMediaResult),',
              ),
              (
                  'const items = asArray(payload.docs).map(normalizeOpenLibraryBook);',
                  'const items: ExternalMediaResult[] = asArray(payload.docs)\n      .map((item) => normalizeOpenLibraryBook(item) as ExternalMediaResult);',
              ),
              (
                  'const merged = dedupeSearchResults(settled.flatMap((entry) => entry.page?.items ?? []));',
                  'const pageItems: ExternalMediaResult[] = settled.flatMap((entry) => entry.page?.items ?? []);\n    const merged = dedupeSearchResults(pageItems) as ExternalMediaResult[];',
              ),
          ]
          for before, after in replacements:
              count = main.count(before)
              if count != 1:
                  raise RuntimeError(f'main type fix expected one match, found {count}: {before}')
              main = main.replace(before, after)
          main_path.write_text(main)

          cache_path = Path('src/cover-cache.ts')
          cache = cache_path.read_text()
          before = '''    const next = this.queued.entries().next();
    if (next.done) {
      if (this.processedSinceDrain) {
        this.processedSinceDrain = false;
        this.onDrain?.();
      }
      return;
    }
    const [key, file] = next.value;
    this.queued.delete(key);
'''
          after = '''    const key = Array.from(this.queued.keys())[0];
    if (key === undefined) {
      if (this.processedSinceDrain) {
        this.processedSinceDrain = false;
        this.onDrain?.();
      }
      return;
    }
    const file = this.queued.get(key);
    this.queued.delete(key);
    if (!file) {
      this.scheduleWorker();
      return;
    }
'''
          count = cache.count(before)
          if count != 1:
              raise RuntimeError(f'cover queue type fix expected one match, found {count}')
          cache_path.write_text(cache.replace(before, after))
          PY
      - run: npm run check
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cover-cache.ts src/search-pagination.ts src/legacy.ts src/main.ts src/settings.ts tests/search-pagination.test.ts tests/cover-cache.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stabilize search and automate cover backfill"
          git push origin HEAD:feature/search-cover-stability
