name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Run check with concise diagnostics
        run: |
          set +e
          npm run check > check.log 2>&1
          status=$?
          tail -n 100 check.log
          exit "$status"
      - run: npm run release:check
