name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/unified-progress-final
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rebuild and validate clean branch
        shell: bash
        run: |
          sed -i 's/feature\/unified-progress-display/feature\/unified-progress-final/g' scripts/rebuild-progress-branch.sh
          bash scripts/rebuild-progress-branch.sh
