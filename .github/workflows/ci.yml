name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Node tests
        run: node scripts/run-tests.mjs
      - name: Serial reading UI check
        run: node scripts/check-serial-reading-ui.mjs
      - name: Test Vault fixture check
        run: node scripts/check-test-vault-fixtures.mjs
      - name: Community check
        run: npm run community:check
      - name: Production build
        run: npm run build
      - name: Release check
        run: npm run release:check
