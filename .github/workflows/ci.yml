name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run npm run check
        id: project-check
        continue-on-error: true
        run: npm run check > check.log 2>&1
      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: serial-cover-check-log
          path: check.log
      - name: Fail when project check failed
        if: steps.project-check.outcome == 'failure'
        run: exit 1
      - run: npm run release:check
