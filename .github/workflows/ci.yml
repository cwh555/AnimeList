name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint classification create state
        run: npx eslint src/classification-create-state.ts --max-warnings 0
      - name: Lint classification create persistence
        run: npx eslint src/classification-create-persistence.ts --max-warnings 0
      - name: Lint classification UI
        run: npx eslint src/classification-ui.ts --max-warnings 0
      - name: Lint classification migration and resolution
        run: npx eslint src/classification-migration.ts src/classification-resolution.ts --max-warnings 0
      - name: Lint AniList classification modules
        run: npx eslint src/anilist-client.ts src/anilist-search.ts src/anilist-classification.ts --max-warnings 0
      - name: Lint remaining source
        run: npm run lint
