name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Capture test diagnostics
        id: test
        continue-on-error: true
        run: npm test > test.log 2>&1
      - name: Post test diagnostics
        if: steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tail -n 100 test.log > test-tail.log && gh pr comment ${{ github.event.pull_request.number }} --body-file test-tail.log
      - name: Fail after test diagnostics
        if: steps.test.outcome == 'failure'
        run: exit 1
      - run: npm run community:check
      - run: npm run build
      - run: npm run release:check
