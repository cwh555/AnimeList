name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/unified-progress-ready
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rebuild and validate clean branch
        shell: bash
        run: |
          set -o pipefail
          sed -i 's/feature\/unified-progress-display/feature\/unified-progress-ready/g' scripts/rebuild-progress-branch.sh
          sed -i 's/status: MediaStatus | string;/status: unknown;/' scripts/rebuild-progress-branch.sh
          bash scripts/rebuild-progress-branch.sh 2>&1 | tee rebuild.log
      - name: Upload rebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-rebuild-log
          path: rebuild.log
