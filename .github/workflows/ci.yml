name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterpiece-check-log
          path: check.log
      - run: npm run release:check
