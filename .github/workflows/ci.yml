name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full checks in UTC
        run: TZ=UTC npm run check
      - name: Run full tests in Asia/Taipei
        run: TZ=Asia/Taipei npm test
      - run: npm run release:check
