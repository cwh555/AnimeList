name: CI

on:
  pull_request:
    branches:
      - validation/full-preview-check

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        run: |
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git --delete validation/full-preview-check || true
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git --delete validation/delete-self || true
