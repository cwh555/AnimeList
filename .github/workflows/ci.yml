name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/classification-ui.ts --max-warnings 0
      - run: npx eslint src/classification-resolution.ts --max-warnings 0
      - run: npx eslint src/classification-search-runtime.ts --max-warnings 0
      - run: npx eslint src/classification-migration.ts --max-warnings 0
      - run: npx eslint src/classification-settings.ts --max-warnings 0
      - run: npx eslint tests/classification-integration.test.ts --max-warnings 0
      - run: npm run lint
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-serial-reading-ui.mjs
      - run: node scripts/check-test-vault-fixtures.mjs
      - run: npm run community:check
      - run: npm run build
      - run: npm run release:check
