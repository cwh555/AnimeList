name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture typecheck diagnostics
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Post typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file typecheck.log
      - name: Fail after typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: npm run lint
      - run: npm test
      - run: npm run community:check
      - run: npm run build
      - run: npm run release:check
