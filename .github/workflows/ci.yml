name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    if: github.head_ref != 'chore/publish-stage2-20260727'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:check

  publish-stage2:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/publish-stage2-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify encoded patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/stage2-patch/part-00 \
            .github/stage2-patch/part-01a \
            .github/stage2-patch/part-01b \
            .github/stage2-patch/part-02 \
            .github/stage2-patch/part-03 \
            .github/stage2-patch/part-04 \
            > /tmp/stage2.patch.gz.b64
          echo "ac883f3fc582d6a389f13fe017a4f474e27379b1704b1658cf74ab2e77d6d7dd  /tmp/stage2.patch.gz.b64" | sha256sum --check --strict
      - name: Decode patch archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/stage2.patch.gz.b64 > /tmp/stage2.patch.gz
          echo "bdb9681a31573fb3636467dc2a1e3bc3455c52842d28a7c9e72b51d74edda6c2  /tmp/stage2.patch.gz" | sha256sum --check --strict
      - name: Verify raw patch
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout /tmp/stage2.patch.gz > /tmp/stage2.patch
          echo "59ad9c54fa015dd8ca8ba8769f7c143d84c7d72bbc68e5739e8ff3b87db5a3d5  /tmp/stage2.patch" | sha256sum --check --strict
      - name: Verify branch guards
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview refactor/stage-2-core-boundaries
          test "$(git rev-parse origin/preview)" = "80fe767974624fb5e05ce2d75d713f5cd67cddf7"
          test "$(git rev-parse origin/refactor/stage-2-core-boundaries)" = "80fe767974624fb5e05ce2d75d713f5cd67cddf7"
      - name: Apply validated commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AnimeList GitHub Agent"
          git config user.email "agent@users.noreply.github.com"
          git switch --force-create refactor/stage-2-core-boundaries origin/preview
          git am /tmp/stage2.patch
          test "$(git rev-list --count origin/preview..HEAD)" = "4"
          git diff --check origin/preview...HEAD
      - name: Push guarded stage branch
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease=refs/heads/refactor/stage-2-core-boundaries:80fe767974624fb5e05ce2d75d713f5cd67cddf7 \
            origin HEAD:refs/heads/refactor/stage-2-core-boundaries
