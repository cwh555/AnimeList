name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run repository checks
        id: repository-checks
        continue-on-error: true
        run: npm run check > check.log 2>&1
      - name: Upload failed check log
        if: steps.repository-checks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: repository-check-log
          path: check.log
      - name: Fail after collecting diagnostics
        if: steps.repository-checks.outcome == 'failure'
        run: exit 1
      - run: npm run release:check
