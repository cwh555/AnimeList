name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-serial-reading-ui.mjs
      - run: node scripts/check-test-vault-fixtures.mjs
      - run: npm run community:check
      - run: npm run build
      - run: npm run release:check
