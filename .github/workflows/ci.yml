name: CI

on:
  push:
    branches: [main, preview, feature/media-classification-v2]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export local validation workspace
        run: |
          git bundle create animelist.bundle --all
          tar -czf animelist-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: classification-local-validation
          path: |
            animelist.bundle
            animelist-node-modules.tar.gz
          retention-days: 1
