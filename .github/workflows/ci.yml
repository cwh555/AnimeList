name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - name: Live Bangumi to AniList classification smoke
        run: |
          node --input-type=module <<'NODE'
          const subjectId = "218712";
          const bgmResponse = await fetch(`https://api.bgm.tv/v0/subjects/${subjectId}`, {
            headers: { Accept: "application/json", "User-Agent": "AnimeList-CI/1.1.2" },
          });
          if (!bgmResponse.ok) throw new Error(`Bangumi HTTP ${bgmResponse.status}`);
          const subject = await bgmResponse.json();
          const queryTitle = String(subject.name || "").trim();
          if (!queryTitle) throw new Error("Bangumi subject returned no original title");

          const query = `query ($search: String) {
            Page(page: 1, perPage: 5) {
              media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
                id genres title { romaji english native }
              }
            }
          }`;
          const aniResponse = await fetch("https://graphql.anilist.co", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
              "User-Agent": "AnimeList-CI/1.1.2",
            },
            body: JSON.stringify({ query, variables: { search: queryTitle } }),
          });
          if (!aniResponse.ok) throw new Error(`AniList HTTP ${aniResponse.status}`);
          const payload = await aniResponse.json();
          if (payload.errors?.length) throw new Error(payload.errors.map((entry) => entry.message).join("; "));
          const media = payload.data?.Page?.media?.[0];
          if (!media?.id || !Array.isArray(media.genres) || media.genres.length === 0) {
            throw new Error(`AniList did not resolve ${queryTitle} with classifications`);
          }
          console.log(JSON.stringify({
            bangumiSubjectId: subjectId,
            bangumiTitle: subject.name_cn || subject.name,
            queryTitle,
            aniListId: media.id,
            aniListTitle: media.title,
            genres: media.genres,
          }, null, 2));
          NODE
