name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging/masterpiece-labels-build
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/refactor-masterpiece-list.mjs
      - run: npm run check
      - run: npm run release:check
      - name: Commit refactor and restore CI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml scripts/refactor-masterpiece-list.mjs src/legacy.ts src/masterpiece-labels.ts src/masterpiece-ui.ts tests/masterpiece-labels.test.ts
          git commit -m "refactor: use shared library list controls"
          git push origin HEAD:staging/masterpiece-labels-build
