name: CI

on:
  pull_request:
    branches:
      - validation/full-preview-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run complete check
        shell: bash
        run: |
          set +e
          npm run check > full-check.log 2>&1
          status=$?
          cat full-check.log
          echo "$status" > full-check.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: full-preview-check-log
          path: |
            full-check.log
            full-check.status
      - name: Verify complete check
        run: test "$(cat full-check.status)" = "0"
      - run: npm run release:check
