name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package exact recovery source
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/animelist-final-architecture-recovery.tar.gz .
      - name: Upload exact recovery source
        uses: actions/upload-artifact@v6
        with:
          name: animelist-final-architecture-recovery
          path: /tmp/animelist-final-architecture-recovery.tar.gz
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full checks in UTC
        run: TZ=UTC npm run check
      - name: Run full tests in Asia/Taipei
        run: TZ=Asia/Taipei npm test
      - run: npm run release:check
