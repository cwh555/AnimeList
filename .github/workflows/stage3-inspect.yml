name: Stage 3 Patch Inspection

on:
  pull_request:
    paths:
      - '.stage3/**'
      - '.github/workflows/stage3-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and unpack immutable patch blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .stage3/stage3.patch.gz)" = "a28f74f9e00ed0a2e25a1c18b148d6a50e807c02"
          gzip -t .stage3/stage3.patch.gz
          gzip -dc .stage3/stage3.patch.gz > /tmp/stage3.patch
          wc -c /tmp/stage3.patch
          sha256sum /tmp/stage3.patch | tee /tmp/stage3.patch.sha256
          sed -n '1,40p' /tmp/stage3.patch
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-patch-inspection
          path: |
            /tmp/stage3.patch
            /tmp/stage3.patch.sha256
          retention-days: 1
