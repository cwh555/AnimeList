name: Stage 3 Patch Inspection

on:
  pull_request:
    paths:
      - '.stage3/**'
      - '.github/workflows/stage3-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect immutable patch blob
        shell: bash
        run: |
          set -u
          {
            echo "expected_git_blob=a28f74f9e00ed0a2e25a1c18b148d6a50e807c02"
            echo "actual_git_blob=$(git hash-object .stage3/stage3.patch.gz)"
            file .stage3/stage3.patch.gz
            wc -c .stage3/stage3.patch.gz
            sha256sum .stage3/stage3.patch.gz
            gzip -t .stage3/stage3.patch.gz
            echo "gzip_status=$?"
            gzip -dc .stage3/stage3.patch.gz > /tmp/stage3.patch
            echo "decompress_status=$?"
            wc -c /tmp/stage3.patch
            sha256sum /tmp/stage3.patch | tee /tmp/stage3.patch.sha256
            sed -n '1,60p' /tmp/stage3.patch
          } | tee /tmp/stage3-inspection.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-patch-inspection
          path: |
            /tmp/stage3.patch
            /tmp/stage3.patch.sha256
            /tmp/stage3-inspection.txt
          if-no-files-found: warn
          retention-days: 1
