name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"
  # A tag pushed using GITHUB_TOKEN does not itself trigger push workflows.
  # The vetted 1.6.0 promoter therefore dispatches this same release workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing exact x.y.z tag to publish (no v prefix)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag, main ancestry and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be an exact x.y.z version (no v prefix)."
            exit 1
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify exact tag release metadata and artifacts
        run: npm run release:check -- "$RELEASE_TAG"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          manifest.json main.js styles.css
          --title "AnimeList $RELEASE_TAG"
          --generate-notes
