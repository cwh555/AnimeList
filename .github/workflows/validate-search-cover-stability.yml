  async searchExternalPage(
    mediaType: MediaType,
    query: string,
    page: number,
  ): Promise<{ results: ExternalMediaResult[]; warnings: string[]; hasMore: boolean }> {
    const tasks: Array<Promise<{ provider: string; page?: { items: ExternalMediaResult[]; hasMore: boolean }; error?: unknown }>> = [];
    if (this.settings.providers.bangumi) {
      tasks.push(this.searchBangumiPage(mediaType, query, page)
        .then((result) => ({ provider: "Bangumi", page: result }))
        .catch((error) => ({ provider: "Bangumi", error })));
    }
    if (this.settings.providers.anilist) {
      tasks.push(this.searchAniListPage(mediaType, query, page)
        .then((result) => ({ provider: "AniList", page: result }))
        .catch((error) => ({ provider: "AniList", error })));
    }
    if (mediaType === "novel" && this.settings.providers.openlibrary) {
      tasks.push(this.searchOpenLibraryPage(query, page)
        .then((result) => ({ provider: "Open Library", page: result }))
        .catch((error) => ({ provider: "Open Library", error })));
    }
    if (!tasks.length) return { results: [], warnings: ["No metadata provider is enabled."], hasMore: false };

    const settled = await Promise.all(tasks);
    const warnings = settled
      .filter((entry) => entry.error !== undefined)
      .map((entry) => `${entry.provider}: ${errorMessage(entry.error)}`);
    const merged = dedupeSearchResults(settled.flatMap((entry) => entry.page?.items ?? []));
    return {
      results: rankSearchResults(merged, query).slice(0, 24),
      warnings,
      hasMore: settled.some((entry) => entry.page?.hasMore === true),
    };
  }

  private async searchBangumiPage(mediaType: MediaType, query: string, page: number) {
    const limit = 20;
    const offset = (page - 1) * limit;
    const response = await requestUrl({
      url: `https://api.bgm.tv/v0/search/subjects?limit=${limit}&offset=${offset}`,
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json",
        "User-Agent": USER_AGENT,
      },
      body: JSON.stringify({
        keyword: query,
        sort: "match",
        filter: { type: [mediaType === "anime" ? 2 : 1], nsfw: false },
      }),
    });
    const payload = response.json ?? JSON.parse(response.text || "{}");
    const items = asArray(payload.data).map((subject) => normalizeBangumiSubject(subject, mediaType));
    const total = typeof payload.total === "number" ? payload.total : null;
    return { items, hasMore: total === null ? items.length === limit : offset + items.length < total };
  }

  private async searchAniListPage(mediaType: MediaType, query: string, page: number) {
    const graphQuery = `
      query ($search: String, $type: MediaType, $format: MediaFormat, $page: Int) {
        Page(page: $page, perPage: 20) {
          pageInfo { hasNextPage }
          media(search: $search, type: $type, format: $format, sort: SEARCH_MATCH) {
            id siteUrl type format status episodes chapters volumes averageScore description(asHtml: false) genres synonyms
            startDate { year month day }
            title { romaji english native }
            coverImage { extraLarge large medium }
            studios(isMain: true) { nodes { name } }
            staff(perPage: 10, sort: RELEVANCE) { edges { role node { name { full native } } } }
          }
        }
      }`;
    const response = await requestUrl({
      url: "https://graphql.anilist.co",
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json",
        "User-Agent": USER_AGENT,
      },
      body: JSON.stringify({
        query: graphQuery,
        variables: {
          search: query,
          type: mediaType === "anime" ? "ANIME" : "MANGA",
          format: mediaType === "novel" ? "NOVEL" : null,
          page,
        },
      }),
    });
    const payload = response.json ?? JSON.parse(response.text || "{}");
    let media = asArray(payload?.data?.Page?.media);
    if (mediaType === "manga") {
      media = media.filter((item: unknown) => !isRecord(item) || stringValue(item.format).toUpperCase() !== "NOVEL");
    }
    return {
      items: media.map((item) => normalizeAniListMedia(item, mediaType)),
      hasMore: payload?.data?.Page?.pageInfo?.hasNextPage === true,
    };
  }

  private async searchOpenLibraryPage(query: string, page: number) {
    const limit = 8;
    const fields = "key,title,author_name,first_publish_year,cover_i,subject";
    const response = await requestUrl({
      url: `https://openlibrary.org/search.json?title=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&limit=${limit}&page=${page}&lang=zh`,
      method: "GET",
      headers: { Accept: "application/json", "User-Agent": USER_AGENT },
    });
    const payload = response.json ?? JSON.parse(response.text || "{}");
    const items = asArray(payload.docs).map(normalizeOpenLibraryBook);
    const total = typeof payload.numFound === "number" ? payload.numFound : null;
    const start = typeof payload.start === "number" ? payload.start : (page - 1) * limit;
    return { items, hasMore: total === null ? items.length === limit : start + items.length < total };
  }

