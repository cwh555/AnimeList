          Path("tests/search-pagination.test.ts").write_text('''import assert from "node:assert/strict";
import { describe, it } from "node:test";
import { readFileSync } from "node:fs";
import path from "node:path";
import { SEARCH_PAGINATION_LIMITS, mergeSearchPages } from "../src/search-pagination";
import type { ExternalMediaResult } from "../src/types";

function result(id: number): ExternalMediaResult {
  return {
    provider: "anilist",
    sourceId: String(id),
    title: `Title ${id}`,
    originalTitle: "",
    romajiTitle: "",
    mediaType: "anime",
    format: "tv",
    total: 12,
    unit: "episode",
    year: 2026,
    genres: [],
    rawGenres: [],
    people: [],
    platforms: [],
    sourceUrl: "",
    coverUrl: "",
    summary: "",
    externalScore: null,
    releaseStatus: "finished",
  };
}

describe("search pagination", () => {
  it("keeps the bounded product limits", () => {
    assert.deepEqual(SEARCH_PAGINATION_LIMITS, { pageSize: 24, maxLoads: 2, maxResults: 72 });
  });

  it("appends new pages without moving existing results", () => {
    const merged = mergeSearchPages([result(1), result(2)], [[result(2), result(3)], [result(4)]]);
    assert.deepEqual(merged.map((item) => item.sourceId), ["1", "2", "3", "4"]);
  });

  it("caps the merged result set at 72 unique entries", () => {
    const initial = Array.from({ length: 24 }, (_, index) => result(index));
    const pageTwo = Array.from({ length: 24 }, (_, index) => result(index + 24));
    const pageThree = Array.from({ length: 40 }, (_, index) => result(index + 48));
    const merged = mergeSearchPages(initial, [pageTwo, pageThree]);
    assert.equal(merged.length, 72);
    assert.equal(merged[0]?.sourceId, "0");
    assert.equal(merged[71]?.sourceId, "71");
  });

  it("uses modal-owned state without mutation observers or prototype patches", () => {
    const legacy = readFileSync(path.join(process.cwd(), "src/legacy.ts"), "utf8");
    assert.doesNotMatch(legacy, /MutationObserver/);
    assert.doesNotMatch(legacy, /prototype\.openAddModal/);
    assert.match(legacy, /async loadMore\(button\)/);
  });

  it("uses provider-native page cursors for additional requests", () => {
    const source = readFileSync(path.join(process.cwd(), "src/main.ts"), "utf8");
    assert.match(source, /offset = \(page - 1\) \* limit/);
    assert.match(source, /Page\(page: \$page, perPage: 20\)/);
    assert.match(source, /pageInfo \{ hasNextPage \}/);
    assert.match(source, /limit=\$\{limit\}&page=\$\{page\}/);
  });
});
''')

          Path("tests/cover-cache.test.ts").write_text('''import assert from "node:assert/strict";
import { describe, it } from "node:test";
import {
  coverCacheGroupKey,
  coverCacheKey,
  coverCachePaths,
  planCoverCacheCleanup,
} from "../src/cover-cache";

function record(path: string, size: number, mtime: number) {
  return { path, size, mtime };
}

describe("cover thumbnail cache", () => {
  it("keys thumbnails by normalized source path and mtime", () => {
    assert.equal(coverCacheKey("AnimeList\\\\Covers\\\\a.jpg", 1234), coverCacheKey("AnimeList/Covers/a.jpg", 1234));
    assert.notEqual(coverCacheKey("AnimeList/Covers/a.jpg", 1234), coverCacheKey("AnimeList/Covers/a.jpg", 1235));
  });

  it("creates a complete immutable thumbnail group", () => {
    const paths = coverCachePaths(".obsidian/plugins/animelist/cache/covers", "Covers/a.jpg", 42);
    assert.match(paths.placeholder, /-24\\.webp$/);
    assert.match(paths.small, /-320\\.webp$/);
    assert.match(paths.large, /-640\\.webp$/);
    assert.equal(new Set(Object.values(paths).map(coverCacheGroupKey)).size, 1);
  });

  it("removes orphan and incomplete groups while retaining valid complete groups", () => {
    const removals = planCoverCacheCleanup([
      record("cache/orphan-24.webp", 10, 1),
      record("cache/orphan-320.webp", 20, 2),
      record("cache/orphan-640.webp", 30, 3),
      record("cache/incomplete-320.webp", 20, 4),
      record("cache/valid-24.webp", 10, 5),
      record("cache/valid-320.webp", 20, 5),
      record("cache/valid-640.webp", 30, 5),
    ], new Set(["cache/valid", "cache/incomplete"]));
    assert.deepEqual(removals, [
      "cache/incomplete-320.webp",
      "cache/orphan-24.webp",
      "cache/orphan-320.webp",
      "cache/orphan-640.webp",
    ]);
  });

  it("evicts oldest valid groups until the target size", () => {
    const records = [
      record("cache/a-24.webp", 20, 100), record("cache/a-320.webp", 20, 100), record("cache/a-640.webp", 20, 100),
      record("cache/b-24.webp", 20, 200), record("cache/b-320.webp", 20, 200), record("cache/b-640.webp", 20, 200),
      record("cache/c-24.webp", 20, 300), record("cache/c-320.webp", 20, 300), record("cache/c-640.webp", 20, 300),
    ];
    const removals = planCoverCacheCleanup(records, new Set(["cache/a", "cache/b", "cache/c"]), {
      maxBytes: 150,
      targetBytes: 100,
    });
    assert.deepEqual(removals, [
      "cache/a-24.webp", "cache/a-320.webp", "cache/a-640.webp",
      "cache/b-24.webp", "cache/b-320.webp", "cache/b-640.webp",
    ]);
  });
});
''')
