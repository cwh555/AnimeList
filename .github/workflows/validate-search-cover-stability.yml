  async search(button) {
    const generation = ++this.searchGeneration;
    this.pageLoads = 0;
    this.hasMore = false;
    this.loading = true;
    button.disabled = true;
    button.textContent = uiText("add.searching");
    try {
      const response = await this.plugin.searchExternal(this.mediaType, this.query);
      if (generation !== this.searchGeneration) return;
      this.results = response.results;
      this.warnings = response.warnings;
      this.hasMore = response.hasMore === true
        && this.results.length < SEARCH_PAGINATION_LIMITS.maxResults;
      if (!this.results.length) new Notice(uiText("notice.searchNoResults"));
    } catch (error) {
      if (generation !== this.searchGeneration) return;
      console.error("AnimeList external search failed", error);
      this.results = [];
      this.warnings = [error?.message || String(error)];
      new Notice(uiText("notice.searchUnavailable"));
    } finally {
      if (generation === this.searchGeneration) {
        this.loading = false;
        this.renderSearch();
      }
    }
  }

  async loadMore(button) {
    if (this.loading || !this.hasMore || this.pageLoads >= SEARCH_PAGINATION_LIMITS.maxLoads) return;
    if (typeof this.plugin.searchExternalPage !== "function") {
      this.hasMore = false;
      this.renderSearch();
      return;
    }
    const generation = this.searchGeneration;
    const mediaType = this.mediaType;
    const query = this.query;
    const page = this.pageLoads + 2;
    const previousLength = this.results.length;
    this.loading = true;
    this.restoreScrollTop = this.modalEl.scrollTop;
    button.disabled = true;
    button.textContent = uiText("add.loadingMore");
    try {
      const response = await this.plugin.searchExternalPage(mediaType, query, page);
      if (generation !== this.searchGeneration || mediaType !== this.mediaType || query !== this.query) return;
      this.results = mergeSearchPages(this.results, [response.results]);
      this.warnings = [...new Set([...this.warnings, ...response.warnings])];
      this.pageLoads += 1;
      this.hasMore = response.hasMore === true
        && this.pageLoads < SEARCH_PAGINATION_LIMITS.maxLoads
        && this.results.length > previousLength
        && this.results.length < SEARCH_PAGINATION_LIMITS.maxResults;
    } catch (error) {
      if (generation !== this.searchGeneration) return;
      console.error("AnimeList external search page failed", error);
      this.warnings = [...new Set([...this.warnings, error?.message || String(error)])];
      this.hasMore = false;
    } finally {
      if (generation === this.searchGeneration) {
        this.loading = false;
        this.renderSearch();
      }
    }
  }

