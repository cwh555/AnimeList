name: Apply timeline test cleanup

on:
  push:
    branches: [feature/fix-timeline-layout]
    paths:
      - scripts/remove-brittle-timeline-wording-test.mjs
      - .github/workflows/apply-timeline-test-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fix-timeline-layout
          fetch-depth: 0
      - name: Remove source-text assertion
        run: |
          node --check scripts/remove-brittle-timeline-wording-test.mjs
          node scripts/remove-brittle-timeline-wording-test.mjs
          git diff --check
      - name: Commit behavioral test cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: remove brittle timeline wording assertion"
          git push origin HEAD:feature/fix-timeline-layout
