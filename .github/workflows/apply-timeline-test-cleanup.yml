name: Apply timeline behavior test cleanup

on:
  push:
    branches:
      - feature/fix-timeline-layout
    paths:
      - scripts/apply-timeline-test-cleanup.mjs
      - .github/workflows/apply-timeline-test-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fix-timeline-layout
          fetch-depth: 0
      - name: Apply test cleanup and remove temporary tooling
        run: |
          node scripts/apply-timeline-test-cleanup.mjs
          rm scripts/apply-timeline-test-cleanup.mjs
          rm .github/workflows/apply-timeline-test-cleanup.yml
          rm .github/workflows/timeline-diagnostics.yml
      - name: Commit behavior tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core.test.ts tests/timeline-scale.test.ts scripts/apply-timeline-test-cleanup.mjs .github/workflows/apply-timeline-test-cleanup.yml .github/workflows/timeline-diagnostics.yml
          git commit -m "test: validate timeline date groups"
          git push origin HEAD:feature/fix-timeline-layout
