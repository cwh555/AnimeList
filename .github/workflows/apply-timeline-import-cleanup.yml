name: Apply timeline import cleanup

on:
  push:
    branches: [feature/fix-timeline-layout]
    paths:
      - scripts/remove-unused-timeline-import.mjs
      - .github/workflows/apply-timeline-import-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fix-timeline-layout
          fetch-depth: 0
      - name: Remove unused import
        run: |
          node --check scripts/remove-unused-timeline-import.mjs
          node scripts/remove-unused-timeline-import.mjs
          git diff --check
      - name: Commit import cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove unused timeline helper import"
          git push origin HEAD:feature/fix-timeline-layout
