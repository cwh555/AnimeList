name: Export serial cover direct apply environment

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/serial-entry-covers
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack exact feature checkout
        run: |
          tar --exclude=.git --exclude=.tmp -czf /tmp/serial-cover-direct-apply-env.tar.gz .
          cp /tmp/serial-cover-direct-apply-env.tar.gz serial-cover-direct-apply-env.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: serial-cover-direct-apply-env
          path: serial-cover-direct-apply-env.tar.gz
          retention-days: 1
