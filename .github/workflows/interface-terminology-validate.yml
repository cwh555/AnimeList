          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full repository check
        run: npm run check

      - name: Run release validation
        run: npm run release:check

      - name: Publish validated branch history
        shell: bash
        run: git push --force-with-lease=refs/heads/feature/interface-terminology:${GITHUB_SHA} origin HEAD:refs/heads/feature/interface-terminology
