name: Export serial entry workspace

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'tmp/export-serial-entry-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/serial-entry-keyboard-flow
          fetch-depth: 0
      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "c060e4b678381264bf7c281cfadd43d7f78ed364"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package exact workspace
        run: tar -czf /tmp/animelist-serial-workspace.tar.gz --exclude=.git --exclude=.tmp .
      - uses: actions/upload-artifact@v4
        with:
          name: animelist-serial-workspace
          path: /tmp/animelist-serial-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
