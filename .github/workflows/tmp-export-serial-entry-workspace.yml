name: Clean serial entry workspace branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'tmp/export-serial-entry-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete temporary branch
        run: git push origin --delete tmp/export-serial-entry-workspace || true
