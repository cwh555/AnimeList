name: Apply serial progress UI changes

on:
  push:
    branches: [feature/serial-progress-ui]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/serial-progress-ui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply focused changes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}\n--- old ---\n{old}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/novel-progress.ts",
              '''export function progressRatio(current: ProgressValue, total: ProgressValue, unit: string): number | null {
            if (unit === "percent") {
              const currentNumber = Number(current);
              return Number.isFinite(currentNumber) ? Math.min(1, Math.max(0, currentNumber / 100)) : null;
            }
            const currentNumber = Number(current);
            const totalNumber = Number(total);
            if (Number.isFinite(currentNumber) && Number.isFinite(totalNumber) && totalNumber > 0) {
              return Math.min(1, Math.max(0, currentNumber / totalNumber));
            }
            const currentLabel = normalizeVolumeLabel(current);
            const totalLabel = normalizeVolumeLabel(total);
            return currentLabel !== null && totalLabel !== null && currentLabel === totalLabel ? 1 : null;
          }
          ''',
              '''export function progressRatio(current: ProgressValue, total: ProgressValue, unit: string): number | null {
            if (unit === "percent") {
              const currentNumber = Number(current);
              return Number.isFinite(currentNumber) ? Math.min(1, Math.max(0, currentNumber / 100)) : null;
            }
            const currentNumber = Number(current);
            const totalNumber = Number(total);
            if (Number.isFinite(currentNumber) && Number.isFinite(totalNumber) && totalNumber > 0) {
              return Math.min(1, Math.max(0, currentNumber / totalNumber));
            }
            const currentLabel = normalizeVolumeLabel(current);
            const totalLabel = normalizeVolumeLabel(total);
            return currentLabel !== null && totalLabel !== null && currentLabel === totalLabel ? 1 : null;
          }

          export function libraryProgressRatio(
            mediaType: string,
            status: string,
            current: ProgressValue,
            total: ProgressValue,
            unit: string,
          ): number | null {
            if (mediaType === "anime") return progressRatio(current, total, unit);
            if (mediaType !== "manga" && mediaType !== "novel") return null;
            if (status === "completed") return 1;
            if (status === "reading" || status === "on_hold" || status === "dropped") return 0.5;
            if (status === "planned") return 0;
            return null;
          }
          ''',
          )

          replace_once(
              "src/legacy.ts",
              '''  progressDisplayValue,
            progressRatio,
            serializeVolumeLog,
          } from "./novel-progress";''',
              '''  progressDisplayValue,
            progressRatio,
            libraryProgressRatio,
            serializeVolumeLog,
          } from "./novel-progress";''',
          )
          replace_once(
              "src/legacy.ts",
              '''  const ratio = (item) => item.mediaType === "anime" ? progressRatio(item.progress, item.total, item.unit) : null;''',
              '''  const ratio = (item) => libraryProgressRatio(item.mediaType, item.status, item.progress, item.total, item.unit);''',
          )
          replace_once(
              "src/legacy.ts",
              '''    return uiText("library.notStarted");''',
              '''    return "";''',
          )
          replace_once(
              "src/legacy.ts",
              '''      bottom.append(statusBadges, makeEl("span", "al-progress-on-cover", progressText(item)));
                media.appendChild(bottom);''',
              '''      bottom.appendChild(statusBadges);
                const coverProgressText = progressText(item);
                if (coverProgressText) bottom.appendChild(makeEl("span", "al-progress-on-cover", coverProgressText));
                media.appendChild(bottom);''',
          )
          replace_once(
              "src/legacy.ts",
              '''      const progressRow = makeEl("div", "al-progress-row");
                progressRow.appendChild(makeEl("span", "", progressText(item)));
                if (itemRatio !== null) progressRow.appendChild(makeEl("span", "", `${Math.round(itemRatio * 100)}%`));
                else if (item.mediaType !== "anime") progressRow.appendChild(makeEl("span", "al-release-label", LABEL.releaseStatus[item.releaseStatus] || uiText("media.release.unknown")));
                progress.appendChild(progressRow);''',
              '''      const progressRow = makeEl("div", "al-progress-row");
                const itemProgressText = progressText(item);
                if (itemProgressText) progressRow.appendChild(makeEl("span", "", itemProgressText));
                if (item.mediaType === "anime" && itemRatio !== null) {
                  progressRow.appendChild(makeEl("span", "", `${Math.round(itemRatio * 100)}%`));
                } else if (item.mediaType !== "anime") {
                  progressRow.appendChild(makeEl("span", "al-release-label", LABEL.releaseStatus[item.releaseStatus] || uiText("media.release.unknown")));
                }
                progress.appendChild(progressRow);''',
          )
          replace_once(
              "src/legacy.ts",
              '''  const add = makeEl("button", "al-secondary-button", uiText("volume.add"));
            add.type = "button";
            header.append(copy, add);
            const rows = makeEl("div", "al-volume-editor-rows");
            section.append(header, rows);''',
              '''  header.appendChild(copy);
            const rows = makeEl("div", "al-volume-editor-rows");
            const addActions = makeEl("div", "al-volume-editor-actions");
            const add = makeEl("button", "al-secondary-button", uiText("volume.add"));
            add.type = "button";
            addActions.appendChild(add);
            section.append(header, rows, addActions);''',
          )

          replace_once(
              "styles.css",
              '''.al-grid.is-list .al-progress { max-width:420px; }''',
              '''.al-grid.is-list .al-progress { width:100%; max-width:none; }''',
          )
          styles = Path("styles.css")
          styles.write_text(styles.read_text() + '''

          /* Serial-reading editor and status-based progress presentation. */
          .animelist-modal .al-volume-editor {
            grid-column: 1 / -1;
            min-width: 0;
          }
          .animelist-modal .al-volume-editor-header {
            align-items: flex-end;
          }
          .animelist-modal .al-volume-editor-actions {
            display: flex;
            justify-content: flex-end;
          }
          .animelist-modal .al-volume-row-fields {
            grid-template-columns: minmax(96px, 120px) repeat(2, minmax(0, 1fr));
            width: 100%;
          }
          .animelist-modal .al-volume-row-fields > .al-form-field:first-child {
            grid-column: auto;
          }
          @media (max-width: 700px) {
            .animelist-modal .al-volume-row-fields {
              grid-template-columns: 1fr;
            }
          }
          ''')

          replace_once(
              "tests/core.test.ts",
              '''  normalizeVolumeLog,
            progressRatio,
            serializeVolumeLog,''',
              '''  normalizeVolumeLog,
            progressRatio,
            libraryProgressRatio,
            serializeVolumeLog,''',
          )
          tests = Path("tests/core.test.ts")
          tests.write_text(tests.read_text() + '''

          describe("serial progress UI", () => {
            it("keeps anime progress numeric while mapping serial reading statuses", () => {
              assert.equal(libraryProgressRatio("anime", "watching", 3, 12, "episode"), 0.25);
              assert.equal(libraryProgressRatio("manga", "completed", 0, 0, "chapter"), 1);
              assert.equal(libraryProgressRatio("manga", "reading", 18, 0, "chapter"), 0.5);
              assert.equal(libraryProgressRatio("novel", "on_hold", 4, 0, "volume"), 0.5);
              assert.equal(libraryProgressRatio("novel", "dropped", 2, 0, "volume"), 0.5);
              assert.equal(libraryProgressRatio("novel", "planned", 0, 0, "volume"), 0);
              assert.equal(libraryProgressRatio("unknown", "planned", 0, 0, "volume"), null);
            });

            it("keeps repeated volume entry controls at the end and uses the modal width", () => {
              const legacySource = readFileSync(path.join(process.cwd(), "src/legacy.ts"), "utf8");
              const stylesheet = readFileSync(path.join(process.cwd(), "styles.css"), "utf8");
              assert.match(legacySource, /section\.append\(header, rows, addActions\)/);
              assert.doesNotMatch(legacySource, /header\.append\(copy, add\)/);
              assert.match(stylesheet, /\.animelist-modal \.al-volume-editor \{[\s\S]*grid-column: 1 \/ -1/);
              assert.match(stylesheet, /\.al-grid\.is-list \.al-progress \{ width:100%; max-width:none; \}/);
            });

            it("does not render not-started copy or fake serial percentages", () => {
              const legacySource = readFileSync(path.join(process.cwd(), "src/legacy.ts"), "utf8");
              assert.doesNotMatch(legacySource, /return uiText\("library\.notStarted"\)/);
              assert.match(legacySource, /item\.mediaType === "anime" && itemRatio !== null/);
            });
          });
          ''')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - name: Commit verified changes and remove bootstrap workflow
        run: |
          rm .github/workflows/agent-serial-progress-ui.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add src/novel-progress.ts src/legacy.ts styles.css tests/core.test.ts .github/workflows/agent-serial-progress-ui.yml
          git commit -m "feat: improve serial reading progress UI"
          git push origin HEAD:feature/serial-progress-ui
