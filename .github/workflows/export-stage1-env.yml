name: Export stage 1 environment

on:
  push:
    branches:
      - chore/export-stage1-env-20260727
  pull_request:
    branches:
      - preview

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package checkout and dependencies
        run: tar --exclude=.git --exclude=.tmp -czf /tmp/animelist-stage1-env.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: animelist-stage1-env
          path: /tmp/animelist-stage1-env.tar.gz
          if-no-files-found: error
          retention-days: 1
