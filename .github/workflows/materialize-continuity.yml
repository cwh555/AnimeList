name: Materialize continuity patch

on:
  pull_request:
    branches:
      - feature/component-polish

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'tmp/continuity-materialize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: tmp/continuity-materialize

      - name: Verify and apply authoritative patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .continuity/patch.gz.b64 > /tmp/continuity.patch.gz
          gzip -dc /tmp/continuity.patch.gz > /tmp/continuity.patch
          test "$(wc -c < /tmp/continuity.patch)" -eq 27842
          echo "1e8a18d08a6ee0d45ddd68ce791f14d5ce24d4bf92dded3a02c24752143c06b  /tmp/continuity.patch" | sha256sum -c -
          git apply --check /tmp/continuity.patch
          git apply /tmp/continuity.patch
          test "$(git diff --name-only | sed '/^$/d' | wc -l)" -eq 5
          git diff --check
          printf '%s\n' 'Materialized files:'
          git diff --name-only

      - name: Commit materialized tree without transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .continuity/patch.gz.b64 .continuity/trigger .continuity/pr-trigger-note .continuity/pr-ready .github/workflows/materialize-continuity.yml
          rmdir .continuity 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: materialize continuity verification tree"
          git push origin HEAD:tmp/continuity-materialize
