name: Promote verified AnimeList release from main CI

# Only a successful push CI on the current main head may mint a public tag.
# GITHUB_TOKEN tag pushes do not initiate another workflow, so dispatch release.yml.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: animelist-main-release-promoter
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate verified main head and consistent release metadata
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$VERIFIED_SHA" ]; then
            echo "::error::main moved since successful CI; refusing stale release."
            exit 1
          fi
          release_version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const read = (file) => JSON.parse(readFileSync(file, "utf8"));
            const pkg = read("package.json"), lock = read("package-lock.json");
            const manifest = read("manifest.json"), versions = read("versions.json");
            const version = pkg.version;
            if (!/^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/.test(version)
              || lock.version !== version || lock.packages?.[""]?.version !== version
              || manifest.version !== version || manifest.id !== "animelist"
              || manifest.minAppVersion !== "1.5.0"
              || versions[version] !== manifest.minAppVersion) {
              throw new Error("Refusing tag: release version metadata is inconsistent.");
            }
            process.stdout.write(version);
          ')"
          existing_tag="$(git ls-remote origin "refs/tags/$release_version" | cut -f1)"
          if [ -n "$existing_tag" ] && [ "$existing_tag" != "$VERIFIED_SHA" ]; then
            echo "::error::An existing release tag points elsewhere; never rewrite it."
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          if gh release view "$release_version" >/dev/null 2>&1; then
            echo "Release already exists; leaving immutable tag and assets untouched."
            echo "PROMOTE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PROMOTE=true" >> "$GITHUB_ENV"
          if [ -n "$existing_tag" ]; then
            echo "CREATE_TAG=false" >> "$GITHUB_ENV"
          else
            echo "CREATE_TAG=true" >> "$GITHUB_ENV"
          fi
      - name: Tag exact commit that passed main push CI
        if: env.PROMOTE == 'true' && env.CREATE_TAG == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"
      - name: Dispatch verified release build and asset attestation
        if: env.PROMOTE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main --field "tag=$RELEASE_VERSION"

