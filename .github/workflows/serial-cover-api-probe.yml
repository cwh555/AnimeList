name: Export serial cover follow-up source

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export exact feature head
        run: |
          git fetch origin feature/serial-entry-covers
          git checkout --detach origin/feature/serial-entry-covers
          git rev-parse HEAD > /tmp/feature-head.txt
          tar --exclude=.git --exclude=node_modules --exclude=.tmp -czf /tmp/serial-cover-followup-source.tar.gz .
          cp /tmp/feature-head.txt .
          cp /tmp/serial-cover-followup-source.tar.gz .
      - uses: actions/upload-artifact@v6
        with:
          name: serial-cover-followup-source
          path: |
            feature-head.txt
            serial-cover-followup-source.tar.gz
          retention-days: 1
