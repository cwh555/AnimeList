name: Serial cover source export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export current feature source
        run: |
          git fetch origin feature/serial-entry-covers
          git checkout --detach origin/feature/serial-entry-covers
          git rev-parse HEAD > /tmp/feature-head.txt
          tar --exclude=.git --exclude=node_modules --exclude=.tmp -czf /tmp/animelist-current-source.tar.gz .
          cp /tmp/animelist-current-source.tar.gz .
          cp /tmp/feature-head.txt .
      - uses: actions/upload-artifact@v6
        with:
          name: animelist-current-source
          path: |
            animelist-current-source.tar.gz
            feature-head.txt
          retention-days: 1
