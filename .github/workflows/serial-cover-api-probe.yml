name: Inspect serial cover payload

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect payload
        run: |
          set +e
          {
            sha256sum .serial-cover-final-payload/chunk-*
            cat .serial-cover-final-payload/chunk-* > /tmp/serial-cover-final.b64
            sha256sum /tmp/serial-cover-final.b64
            base64 --decode /tmp/serial-cover-final.b64 > /tmp/serial-cover-final.tar.gz
            echo "base64_status=$?"
            sha256sum /tmp/serial-cover-final.tar.gz
            tar -tzf /tmp/serial-cover-final.tar.gz
            echo "tar_status=$?"
          } > payload-debug.txt 2>&1
          cat payload-debug.txt
      - uses: actions/upload-artifact@v6
        with:
          name: serial-cover-payload-debug
          path: payload-debug.txt
          retention-days: 1
