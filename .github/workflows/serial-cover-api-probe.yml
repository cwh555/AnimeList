name: Probe one Bangumi search
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python - <<'PY'
          import json, urllib.request
          q='\u516d\u7573\u9593\u306e\u4fb5\u7565\u8005\uff01\uff1f 1'
          body=json.dumps({'keyword':q,'sort':'match','filter':{'type':[1]}},ensure_ascii=False).encode()
          req=urllib.request.Request('https://api.bgm.tv/v0/search/subjects?limit=50&offset=0',data=body,headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'AnimeList/1.1.2'})
          with urllib.request.urlopen(req,timeout=45) as r: data=json.loads(r.read())
          open('search.json','w').write(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: one-search
          path: search.json
          retention-days: 1
