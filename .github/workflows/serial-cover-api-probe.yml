name: Validate serial cover UI ordering and timeline

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Prepare isolated feature staging branch
        env:
          EXPECTED_FEATURE_HEAD: fcb280bb3e3f32c3b669f5d749c3bb62dedb1da1
        run: |
          git fetch origin feature/serial-entry-covers chore/serial-cover-ui-order-timeline-fix
          test "$(git rev-parse origin/feature/serial-entry-covers)" = "$EXPECTED_FEATURE_HEAD"
          staging_head="$(git rev-parse origin/chore/serial-cover-ui-order-timeline-fix)"
          echo "STAGING_HEAD=$staging_head" >> "$GITHUB_ENV"
          git checkout -B chore/serial-cover-ui-order-timeline-fix origin/chore/serial-cover-ui-order-timeline-fix
          git merge-base --is-ancestor "$EXPECTED_FEATURE_HEAD" HEAD
      - name: Run npm ci
        run: npm ci
      - name: Run npm run check
        run: npm run check
      - name: Run npm run release:check
        run: npm run release:check
      - name: Build production Test Vault
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: npm run test-vault
      - name: Verify generated stylesheet and publish staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- styles.css; then
            git add styles.css
            git commit -m "build: refresh generated serial cover styles"
            git push --force-with-lease=refs/heads/chore/serial-cover-ui-order-timeline-fix:$STAGING_HEAD origin HEAD:chore/serial-cover-ui-order-timeline-fix
          fi
          git status --short
