name: Verify live serial cover queue
run-name: Live serial cover queue validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check out validated feature head
        env:
          EXPECTED_FEATURE_HEAD: b6aedf8c9effe4772cd3bd7db4182ffd04f0e451
        run: |
          git fetch origin feature/serial-entry-covers
          test "$(git rev-parse origin/feature/serial-entry-covers)" = "$EXPECTED_FEATURE_HEAD"
          git checkout --detach origin/feature/serial-entry-covers
      - name: Run npm ci
        run: npm ci
      - name: Verify rapid live lookups stay ordered
        run: |
          mkdir -p .tmp
          cat > .tmp/obsidian-live.ts <<'TS'
          export async function requestUrl(options: { url: string; method?: string; body?: string; headers?: Record<string, string> }): Promise<{ json: unknown; text: string }> {
            const response = await fetch(options.url, {
              method: options.method ?? "GET",
              body: options.body,
              headers: options.headers,
            });
            const text = await response.text();
            if (!response.ok) {
              const error = new Error(`Request failed with status ${response.status}`) as Error & {
                status: number;
                response: { status: number; headers: Headers };
              };
              error.status = response.status;
              error.response = { status: response.status, headers: response.headers };
              throw error;
            }
            return { json: text ? JSON.parse(text) : {}, text };
          }
          TS
          cat > .tmp/live-serial-queue.ts <<'TS'
          import { writeFile } from "node:fs/promises";
          import { SerialCoverLoadQueue } from "../src/serial-cover-load-queue";
          import {
            clearSerialCoverProviderCache,
            configureSerialCoverProvider,
            configureSerialCoverProviderForTests,
            searchSerialCovers,
          } from "../src/serial-cover-provider";
          import { confidentSerialCover, serialCoverQuery } from "../src/serial-entry-cover";

          const originalTitle = "無職転生 ～異世界行ったら本気だす～";
          const expected = new Map([
            ["14", "223981"],
            ["16", "260752"],
            ["17", "260753"],
            ["18", "260754"],
            ["19", "260755"],
            ["20", "267778"],
          ]);
          const labels = [...expected.keys()];
          const queue = new SerialCoverLoadQueue();
          const events: string[] = [];
          const report: Array<Record<string, unknown>> = [];

          configureSerialCoverProvider({ apiKey: "" });
          configureSerialCoverProviderForTests({
            sleep: (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds)),
            random: () => 0,
          });
          clearSerialCoverProviderCache();

          const tasks = labels.map((label) => queue.enqueue(label, async () => {
            events.push(`${label}:start`);
            const query = serialCoverQuery(originalTitle, label);
            if (!query) throw new Error(`Could not build query for ${label}`);
            const candidates = await searchSerialCovers(query, originalTitle, label, "novel");
            const selected = confidentSerialCover(candidates);
            if (!selected) throw new Error(`Volume ${label}: no confident result`);
            const expectedId = expected.get(label);
            if (selected.sourceId !== expectedId) {
              throw new Error(`Volume ${label}: expected ${expectedId}, got ${selected.sourceId}`);
            }
            const image = await fetch(selected.coverUrl, {
              headers: {
                Range: "bytes=0-255",
                "User-Agent": "AnimeList/1.1.2 (https://github.com/cwh555/AnimeList)",
              },
            });
            const bytes = await image.arrayBuffer();
            if (!image.ok || bytes.byteLength === 0) {
              throw new Error(`Volume ${label}: cover download failed (${image.status})`);
            }
            events.push(`${label}:end`);
            report.push({
              label,
              sourceId: selected.sourceId,
              title: selected.title,
              score: selected.score,
              coverStatus: image.status,
              coverBytes: bytes.byteLength,
            });
          }));

          try {
            await Promise.all(tasks);
            await queue.whenIdle();
            const expectedEvents = labels.flatMap((label) => [`${label}:start`, `${label}:end`]);
            if (JSON.stringify(events) !== JSON.stringify(expectedEvents)) {
              throw new Error(`Unexpected queue order: ${JSON.stringify(events)}`);
            }
            if (report.length !== labels.length) {
              throw new Error(`Expected ${labels.length} results, got ${report.length}`);
            }
            console.log(JSON.stringify({ labels, events, report }, null, 2));
          } finally {
            await writeFile("serial-cover-live-queue-report.json", JSON.stringify({ labels, events, report }, null, 2));
          }
          TS
          npx esbuild .tmp/live-serial-queue.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node24 \
            --alias:obsidian=./.tmp/obsidian-live.ts \
            --outfile=.tmp/live-serial-queue.mjs
          node .tmp/live-serial-queue.mjs | tee serial-cover-live-queue.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: serial-cover-live-queue-report
          path: |
            serial-cover-live-queue-report.json
            serial-cover-live-queue.log
          if-no-files-found: warn
          retention-days: 1
