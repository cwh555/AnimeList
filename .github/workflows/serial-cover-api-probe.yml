name: Export validated serial cover head

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export staging head
        run: |
          git fetch origin chore/serial-cover-final-publish feature/serial-entry-covers
          git rev-parse origin/chore/serial-cover-final-publish > staging-head.txt
          git rev-parse origin/feature/serial-entry-covers > feature-head.txt
          git rev-list --left-right --count origin/feature/serial-entry-covers...origin/chore/serial-cover-final-publish > ahead-behind.txt
          git diff --quiet origin/chore/serial-cover-final-publish -- src/serial-cover-provider.ts src/serial-entry-cover.ts src/serial-cover-service.ts src/serial-cover-text.ts tests/serial-entry-cover.test.ts || true
          cat staging-head.txt feature-head.txt ahead-behind.txt
      - uses: actions/upload-artifact@v6
        with:
          name: validated-serial-cover-head
          path: |
            staging-head.txt
            feature-head.txt
            ahead-behind.txt
          retention-days: 1
