name: Serial cover API probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Probe NDL and openBD serial covers
        run: |
          python - <<'PY'
          import json
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          works = {
              "KonoSuba": "この素晴らしい世界に祝福を！",
              "Mushoku Tensei": "無職転生 ～異世界行ったら本気だす～",
              "Invaders of the Rokujouma": "六畳間の侵略者！？",
              "That Time I Got Reincarnated as a Slime": "転生したらスライムだった件",
          }
          volumes = range(1, 11)
          user_agent = "AnimeList-serial-cover-probe/1.0 (https://github.com/cwh555/AnimeList)"
          isbn_pattern = re.compile(r"(?<!\d)(97[89][\d\-]{10,16}|\d[\d\-]{8,15}[\dXx])(?!\d)")

          def request_bytes(url, attempts=5):
              delay = 2.0
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(url, headers={"Accept": "application/xml, application/json;q=0.9, */*;q=0.8", "User-Agent": user_agent})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return response.status, response.headers, response.read()
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == attempts - 1:
                          raise
                      retry_after = error.headers.get("Retry-After", "")
                      wait = float(retry_after) if retry_after.isdigit() else delay + random.random()
                      time.sleep(wait)
                      delay = min(30.0, delay * 2)

          def local_name(tag):
              return tag.rsplit("}", 1)[-1].lower()

          def normalized_isbn(value):
              digits = re.sub(r"[^0-9Xx]", "", value)
              return digits.upper() if len(digits) in (10, 13) else ""

          def parse_ndl(xml_bytes):
              root = ET.fromstring(xml_bytes)
              entries = []
              for item in root.iter():
                  if local_name(item.tag) != "item":
                      continue
                  texts = []
                  title = ""
                  links = []
                  for node in item.iter():
                      name = local_name(node.tag)
                      value = (node.text or "").strip()
                      if value:
                          texts.append(value)
                      if name == "title" and value and not title:
                          title = value
                      for key, attr in node.attrib.items():
                          if key.lower().endswith(("url", "href")) and attr:
                              links.append(attr)
                  combined = "\n".join(texts)
                  isbns = []
                  for match in isbn_pattern.findall(combined):
                      isbn = normalized_isbn(match)
                      if isbn and isbn not in isbns:
                          isbns.append(isbn)
                  image_urls = [url for url in links if re.search(r"\.(?:jpe?g|png|webp)(?:\?|$)", url, re.I)]
                  entries.append({"title": title, "isbns": isbns, "imageUrls": image_urls, "sample": combined[:500]})
              return entries

          def openbd(isbns):
              if not isbns:
                  return []
              params = urllib.parse.urlencode({"isbn": ",".join(isbns[:100])})
              status, _, body = request_bytes("https://api.openbd.jp/v1/get?" + params)
              values = json.loads(body.decode("utf-8"))
              return [value for value in values if isinstance(value, dict)]

          def openbd_summary(value):
              summary = value.get("summary") or {}
              return {
                  "isbn": str(summary.get("isbn") or ""),
                  "title": str(summary.get("title") or ""),
                  "volume": str(summary.get("volume") or ""),
                  "series": str(summary.get("series") or ""),
                  "publisher": str(summary.get("publisher") or ""),
                  "cover": str(summary.get("cover") or ""),
              }

          report = []
          for display, original in works.items():
              for volume in volumes:
                  query = f"{original} {volume}"
                  url = "https://ndlsearch.ndl.go.jp/api/opensearch?" + urllib.parse.urlencode({
                      "cnt": 30,
                      "title": query,
                      "dpid": "iss-ndl-opac-national",
                  })
                  row = {"work": display, "volume": volume, "query": query, "ndlStatus": None, "ndlEntries": [], "openbd": [], "covers": []}
                  try:
                      status, _, body = request_bytes(url)
                      row["ndlStatus"] = status
                      entries = parse_ndl(body)
                      row["ndlEntries"] = entries[:10]
                      isbns = []
                      for entry in entries:
                          for isbn in entry["isbns"]:
                              if isbn not in isbns:
                                  isbns.append(isbn)
                      books = [openbd_summary(value) for value in openbd(isbns)]
                      row["openbd"] = books
                      row["covers"] = [book for book in books if book["cover"]]
                      if not row["covers"]:
                          row["covers"] = [
                              {"title": entry["title"], "cover": url, "isbn": "", "volume": "", "series": original, "publisher": "NDL"}
                              for entry in entries for url in entry["imageUrls"]
                          ]
                  except Exception as error:
                      row["error"] = f"{type(error).__name__}: {error}"
                  report.append(row)
                  print(json.dumps({"work": display, "volume": volume, "ndlStatus": row.get("ndlStatus"), "entries": len(row["ndlEntries"]), "openbd": len(row["openbd"]), "covers": len(row["covers"]), "error": row.get("error")}, ensure_ascii=False), flush=True)
                  time.sleep(1.5)

          Path("serial-cover-ndl-openbd-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          summary = {}
          for display in works:
              rows = [row for row in report if row["work"] == display]
              summary[display] = {"successful": sum(bool(row["covers"]) for row in rows), "total": len(rows)}
          print("SUMMARY", json.dumps(summary, ensure_ascii=False), flush=True)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: serial-cover-ndl-openbd-report
          path: serial-cover-ndl-openbd-report.json
          retention-days: 1
