name: Validate final serial cover provider

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate source, Test Vault, and 40 live covers
        run: bash .github/scripts/validate-serial-cover-final.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: serial-cover-final-validation
          path: |
            serial-cover-live-report.json
            serial-cover-live.log
          if-no-files-found: warn
          retention-days: 1
