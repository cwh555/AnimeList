name: Serial cover API probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Probe Bangumi duplicate subject metadata
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          ids = [120888,151881,124786,176844,124787,206986,134677,222647,134678,231816,177985,231817,177984,239823]
          output=[]
          for subject_id in ids:
              req=urllib.request.Request(f'https://api.bgm.tv/v0/subjects/{subject_id}',headers={'Accept':'application/json','User-Agent':'AnimeList/1.1.2 (https://github.com/cwh555/AnimeList)'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.loads(response.read().decode('utf-8'))
              output.append({k:data.get(k) for k in ['id','name','name_cn','type','platform','meta_tags','infobox','images']})
              print(json.dumps(output[-1],ensure_ascii=False),flush=True)
              time.sleep(0.7)
          Path('bangumi-subject-details.json').write_text(json.dumps(output,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: bangumi-subject-details
          path: bangumi-subject-details.json
          retention-days: 1
