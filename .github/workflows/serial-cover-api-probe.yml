name: Serial cover API probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Extract validated change script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/publish-serial-cover-api-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          block = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          lines = [(line[10:] if line.startswith('          ') else line) for line in block.splitlines()]
          Path('/tmp/apply-serial-cover-api-fix.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Verify feature head
        env:
          EXPECTED_HEAD: cdffd614425b0aabee735cbf5313e18d0b0fb2e6
        run: |
          git fetch origin feature/serial-entry-covers
          test "$(git rev-parse origin/feature/serial-entry-covers)" = "$EXPECTED_HEAD"
          git checkout -B feature/serial-entry-covers origin/feature/serial-entry-covers
      - name: Apply validated changes
        run: python /tmp/apply-serial-cover-api-fix.py
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - name: Publish only after validation
        env:
          EXPECTED_HEAD: cdffd614425b0aabee735cbf5313e18d0b0fb2e6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/settings.ts src/main.ts src/serial-entry-cover.ts src/serial-cover-provider.ts src/serial-cover-service.ts src/serial-cover-feature.ts src/serial-cover-settings.ts src/serial-cover-text.ts tests/core.test.ts tests/serial-entry-cover.test.ts
          git commit -m "fix: make serial cover lookup quota-safe"
          git push --force-with-lease=refs/heads/feature/serial-entry-covers:$EXPECTED_HEAD origin HEAD:feature/serial-entry-covers
