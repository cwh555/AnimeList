name: Publish validated cover thumbnails

on:
  pull_request:
    branches: [preview]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cover-thumbnails
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply final cover integration
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";

          function replaceOne(source, before, after, label) {
            if (source.includes(after)) return source;
            const matches = source.split(before).length - 1;
            if (matches !== 1) throw new Error(`${label}: expected one match, found ${matches}`);
            return source.replace(before, after);
          }

          const workflow = readFileSync(".github/workflows/validate-cover-thumbnails.yml", "utf8");
          const marker = "          node --input-type=module <<'NODE'\n";
          const start = workflow.indexOf(marker);
          const end = workflow.indexOf("\n          NODE", start + marker.length);
          if (start < 0 || end < 0) throw new Error("Canonical integration script was not found");
          const script = workflow.slice(start + marker.length, end)
            .split("\n")
            .map((line) => line.startsWith("          ") ? line.slice(10) : line)
            .join("\n");
          writeFileSync("/tmp/apply-cover-integration.mjs", script);
          const result = spawnSync(process.execPath, ["/tmp/apply-cover-integration.mjs"], { stdio: "inherit" });
          if (result.status !== 0) process.exit(result.status ?? 1);

          const cachePath = "src/cover-cache.ts";
          let cache = readFileSync(cachePath, "utf8");
          cache = replaceOne(cache, "    if (active) return active;", "    if (active !== undefined) return active;", "active promise guard");
          writeFileSync(cachePath, cache);

          const textPath = "src/ui-text.ts";
          let text = readFileSync(textPath, "utf8");
          text = replaceOne(
            text,
            '  "notice.coverOptimizeProgress": "正在最佳化封面：{completed} / {total}",',
            '  "notice.coverOptimizeProgress": "正在最佳化封面：已完成 {completed} 張，共 {total} 張",',
            "cover optimization progress wording",
          );
          const duplicateNoticeBlock = '\n  "notice.coverOptimizeEmpty": "收藏庫中沒有可最佳化的本地封面。",\n  "notice.coverOptimizeProgress": "正在最佳化封面：{completed}，共 {total}",\n  "notice.coverOptimizeDone": "封面最佳化完成：成功 {optimized}，失敗 {failed}。",\n  "notice.coverCacheCleared": "已清除 {removed} 個封面縮圖快取檔案。"';
          const duplicateMatches = text.split(duplicateNoticeBlock).length - 1;
          if (duplicateMatches !== 1) throw new Error(`duplicate cover notices: expected one match, found ${duplicateMatches}`);
          text = text.replace(duplicateNoticeBlock, "");
          writeFileSync(textPath, text);

          const testPath = "tests/core.test.ts";
          let tests = readFileSync(testPath, "utf8");
          tests = replaceOne(
            tests,
            '  it("keeps compact rows at cover height and starts their covers immediately", () => {\n    const legacySource = readFileSync(path.join(process.cwd(), "src/legacy.ts"), "utf8");\n    const stylesheet = readFileSync(path.join(process.cwd(), "styles.css"), "utf8");\n\n    assert.match(legacySource, /image\\.loading = state\\.view === "poster" \\? "eager" : "lazy"/);\n    assert.match(legacySource, /image\\.decoding = "async"/);',
            '  it("keeps compact rows at cover height and bounds eager cover loading", () => {\n    const legacySource = readFileSync(path.join(process.cwd(), "src/legacy.ts"), "utf8");\n    const stylesheet = readFileSync(path.join(process.cwd(), "styles.css"), "utf8");\n\n    assert.match(legacySource, /image\\.loading = "lazy"/);\n    assert.match(legacySource, /const eagerCoverCount = \\(view\\) => view === "poster" \\? 10 : view === "list" \\? 4 : 6/);\n    assert.match(legacySource, /image\\.loading = index < eagerCount \\? "eager" : "lazy"/);\n    assert.match(legacySource, /image\\.fetchPriority = index < 2 \\? "high" : "auto"/);\n    assert.match(legacySource, /image\\.sizes = coverSizes\\(state\\.view\\)/);\n    assert.match(legacySource, /image\\.decoding = "async"/);',
            "compact cover loading test",
          );
          writeFileSync(testPath, tests);
          NODE
      - run: npm run check
      - name: Publish one clean commit to preview
        shell: bash
        run: |
          set -euo pipefail
          expected_preview=9f4e7fa5cd2ee79a8b8f42061c98079a955efbad
          git fetch origin preview
          test "$(git rev-parse origin/preview)" = "$expected_preview"
          files=(
            src/cover-cache.ts
            src/types.ts
            src/main.ts
            src/legacy.ts
            src/ui-text.ts
            types/obsidian.d.ts
            scripts/run-tests.mjs
            styles.css
            tests/cover-cache.test.ts
            tests/core.test.ts
          )
          rm -rf /tmp/animelist-cover-final
          mkdir -p /tmp/animelist-cover-final
          for file in "${files[@]}"; do
            mkdir -p "/tmp/animelist-cover-final/$(dirname "$file")"
            cp "$file" "/tmp/animelist-cover-final/$file"
          done
          git reset --hard origin/preview
          for file in "${files[@]}"; do
            cp "/tmp/animelist-cover-final/$file" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "feat: optimize library cover loading"
          git push origin HEAD:preview
          git push origin --delete feature/cover-thumbnails
