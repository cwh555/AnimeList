name: Capture cover thumbnail check

on:
  pull_request:
    branches: [preview]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cover-thumbnails
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply the canonical integration script
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          const workflow = readFileSync(".github/workflows/validate-cover-thumbnails.yml", "utf8");
          const marker = "          node --input-type=module <<'NODE'\n";
          const start = workflow.indexOf(marker);
          const end = workflow.indexOf("\n          NODE", start + marker.length);
          if (start < 0 || end < 0) throw new Error("Canonical integration script was not found");
          const script = workflow.slice(start + marker.length, end)
            .split("\n")
            .map((line) => line.startsWith("          ") ? line.slice(10) : line)
            .join("\n");
          writeFileSync("/tmp/apply-cover-integration.mjs", script);
          const result = spawnSync(process.execPath, ["/tmp/apply-cover-integration.mjs"], { stdio: "inherit" });
          if (result.status !== 0) process.exit(result.status ?? 1);

          const cachePath = "src/cover-cache.ts";
          let cache = readFileSync(cachePath, "utf8");
          const before = "    if (active) return active;";
          const after = "    if (active !== undefined) return active;";
          if (!cache.includes(after)) {
            const matches = cache.split(before).length - 1;
            if (matches !== 1) throw new Error(`active promise guard: expected one match, found ${matches}`);
            cache = cache.replace(before, after);
            writeFileSync(cachePath, cache);
          }
          NODE
      - run: npm run check
      - name: Commit validated feature source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cover-cache.ts src/types.ts src/main.ts src/legacy.ts src/ui-text.ts types/obsidian.d.ts scripts/run-tests.mjs styles.css tests/cover-cache.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: optimize library cover loading"
          git push origin HEAD:feature/cover-thumbnails
