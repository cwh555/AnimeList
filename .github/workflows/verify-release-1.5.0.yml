name: Verify AnimeList 1.5.0 release

on:
  push:
    branches:
      - fix/settings-declarative-search
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 705e77b2175c1ce0e9c070ede120427310ae1a28
          fetch-depth: 0
      - name: Verify release, tag, and published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 705e77b2175c1ce0e9c070ede120427310ae1a28
        run: |
          set -euo pipefail
          info="$(gh release view 1.5.0 --repo cwh555/AnimeList --json tagName,name,isDraft,isPrerelease,url,assets)"
          test "$(jq -r '.tagName' <<<"$info")" = "1.5.0"
          test "$(jq -r '.name' <<<"$info")" = "AnimeList 1.5.0"
          test "$(jq -r '.isDraft' <<<"$info")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$info")" = "false"
          printf '%s\n' "$info" | jq -e '[.assets[].name] | sort == ["main.js","manifest.json","styles.css"]' >/dev/null

          git fetch origin refs/tags/1.5.0:refs/tags/1.5.0
          test "$(git rev-parse '1.5.0^{commit}')" = "$TARGET_SHA"

          rm -rf /tmp/animelist-release-1.5.0
          mkdir -p /tmp/animelist-release-1.5.0
          gh release download 1.5.0 --repo cwh555/AnimeList --dir /tmp/animelist-release-1.5.0
          cmp manifest.json /tmp/animelist-release-1.5.0/manifest.json
          cmp main.js /tmp/animelist-release-1.5.0/main.js
          cmp styles.css /tmp/animelist-release-1.5.0/styles.css
