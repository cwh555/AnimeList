name: Publish AnimeList 1.5.0

on:
  push:
    branches:
      - fix/settings-declarative-search

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 705e77b2175c1ce0e9c070ede120427310ae1a28
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full checks in UTC
        run: TZ=UTC npm run check
      - name: Run full tests in Asia/Taipei
        run: TZ=Asia/Taipei npm test
      - name: Validate release metadata against tag
        run: npm run release:check
        env:
          GITHUB_REF_NAME: 1.5.0
          GITHUB_REF_TYPE: tag
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub release and 1.5.0 tag on main release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "1.5.0"
          manifest.json main.js styles.css
          --target "705e77b2175c1ce0e9c070ede120427310ae1a28"
          --title "AnimeList 1.5.0"
          --generate-notes
