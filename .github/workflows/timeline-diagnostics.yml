name: Timeline diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and show failing test
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$HEAD_REF" https://github.com/cwh555/AnimeList.git repo
          cd repo
          npm ci --silent
          if ! npm test > test.log 2>&1; then
            grep -n -B 20 -A 40 "not ok" test.log | tail -n 140
            exit 1
          fi
