name: Timeline diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and lint branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$HEAD_REF" https://github.com/cwh555/AnimeList.git repo
          cd repo
          npm ci --silent
          npm run lint
