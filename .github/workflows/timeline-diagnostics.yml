name: Timeline diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and show test failure
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$HEAD_REF" https://github.com/cwh555/AnimeList.git repo
          cd repo
          npm ci --silent
          if ! npm test > test.log 2>&1; then
            grep -n -B 25 -A 45 "not ok" test.log | tail -n 180
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and run lint
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$HEAD_REF" https://github.com/cwh555/AnimeList.git repo
          cd repo
          npm ci --silent
          npm run lint
