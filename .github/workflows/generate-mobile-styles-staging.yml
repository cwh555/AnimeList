name: Generate mobile styles staging

on:
  push:
    branches: [stage/mobile-responsive-ui]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/mobile-responsive-ui
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run styles:build
      - name: Verify exact generated style blob
        run: |
          test "$(git hash-object styles.css)" = "ae68081973502cc5b8e31e17445d5d8d65c4d179"
      - name: Commit generated stylesheet
        run: |
          if git diff --quiet -- styles.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "build: generate mobile stylesheet"
          git push origin HEAD:stage/mobile-responsive-ui
