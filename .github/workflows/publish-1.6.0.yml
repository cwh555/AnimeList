name: Promote AnimeList 1.6.0 after verified main CI

# Single-version publication bridge: it is deliberately inert once 1.6.0
# exists. GitHub Actions GITHUB_TOKEN tag pushes do not trigger push workflows,
# so this workflow explicitly dispatches the normal release.yml.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  promote:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify main head and 1.6.0 metadata before publishing
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$VERIFIED_SHA" ]; then
            echo "::error::main moved after the successful CI; refusing to publish a stale commit."
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const read = (path) => JSON.parse(readFileSync(path, "utf8"));
            const pkg = read("package.json"), lock = read("package-lock.json");
            const manifest = read("manifest.json"), versions = read("versions.json");
            if (pkg.version !== "1.6.0" || lock.version !== "1.6.0"
              || lock.packages[""].version !== "1.6.0"
              || manifest.version !== "1.6.0"
              || manifest.minAppVersion !== "1.5.0"
              || versions["1.6.0"] !== manifest.minAppVersion) {
              throw new Error("Refusing tag: 1.6.0 version metadata does not agree.");
            }
          '
          existing_tag="$(git ls-remote origin refs/tags/1.6.0 | cut -f1)"
          if [ -n "$existing_tag" ] && [ "$existing_tag" != "$VERIFIED_SHA" ]; then
            echo "::error::An existing 1.6.0 tag points elsewhere. Never overwrite release tags."
            exit 1
          fi
          if gh release view 1.6.0 >/dev/null 2>&1; then
            echo "GitHub Release 1.6.0 already exists; no further action."
            echo "PROMOTE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$existing_tag" ]; then
            echo "CREATE_TAG=false" >> "$GITHUB_ENV"
          else
            echo "CREATE_TAG=true" >> "$GITHUB_ENV"
          fi
          echo "PROMOTE=true" >> "$GITHUB_ENV"
      - name: Tag the exactly verified main commit
        if: env.PROMOTE == 'true' && env.CREATE_TAG == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git tag 1.6.0
          git push origin refs/tags/1.6.0
      - name: Dispatch release workflow for exact 1.6.0 tag
        if: env.PROMOTE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main --field tag=1.6.0
