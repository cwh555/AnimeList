name: PR diagnostics

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run check and report failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          npm run check > /tmp/check.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo 'Temporary CI diagnostic:'
              echo
              echo '```text'
              tail -n 120 /tmp/check.log
              echo '```'
            } > /tmp/comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
            exit "$status"
          fi
