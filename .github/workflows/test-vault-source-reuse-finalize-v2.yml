name: Test Vault Source Reuse Finalize V2

on:
  pull_request:
    branches:
      - preview

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging head
        uses: actions/checkout@v7
        with:
          ref: feature/release-tracking
          fetch-depth: 0

      - name: Verify staging head
        shell: bash
        run: |
          set -euo pipefail
          STAGING="$(git rev-parse HEAD)"
          git fetch origin feature/release-tracking
          test "$(git rev-parse origin/feature/release-tracking)" = "$STAGING"

      - name: Apply source-identity Test Vault fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          fixture = Path('scripts/test-vault-fixtures.mjs')
          s = fixture.read_text()
          helper_start = s.index('function fixtureLooksCurrent(content, item) {')
          helper_end = s.index('function checklistContent() {')
          helpers = r'''function frontmatterScalar(content, key) {
            const block = String(content ?? "").match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/)?.[1] ?? "";
            const match = block.match(new RegExp(`^${key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}:\\s*(.+?)\\s*$`, "m"));
            if (!match) return "";
            const raw = match[1].trim();
            if (!raw) return "";
            if (raw.startsWith('"')) {
              try { return String(JSON.parse(raw)); } catch { return raw.replace(/^"|"$/g, ""); }
            }
            if (raw.startsWith("'")) return raw.replace(/^'|'$/g, "").replace(/''/g, "'");
            return raw.replace(/\s+#.*$/, "").trim();
          }

          function sourceKey(provider, sourceId) {
            return `${String(provider ?? "").trim()}\u0000${String(sourceId ?? "").trim()}`;
          }

          function managedMediaFolders(vaultRoot) {
            return ["Anime", "Manga", "Novel"].map((folder) => path.join(vaultRoot, TEST_LIBRARY_ROOT, folder));
          }

          function scanManagedSourceNotes(vaultRoot) {
            const bySource = new Map();
            const visit = (folder) => {
              for (const entry of fs.readdirSync(folder, { withFileTypes: true })) {
                const filePath = path.join(folder, entry.name);
                if (entry.isDirectory()) {
                  visit(filePath);
                  continue;
                }
                if (!entry.isFile() || !entry.name.endsWith(".md")) continue;
                const content = fs.readFileSync(filePath, "utf8");
                const provider = frontmatterScalar(content, "source_provider");
                const sourceId = frontmatterScalar(content, "source_id");
                if (!provider || !sourceId) continue;
                const key = sourceKey(provider, sourceId);
                const existing = bySource.get(key);
                if (!existing || filePath.localeCompare(existing.filePath, "en") < 0) {
                  bySource.set(key, { filePath, content });
                }
              }
            };
            for (const folder of managedMediaFolders(vaultRoot)) {
              if (fs.existsSync(folder)) visit(folder);
            }
            return bySource;
          }

          function isFixtureManaged(content) {
            return Boolean(
              frontmatterScalar(content, "fixture_case")
              || frontmatterScalar(content, "fixture_version")
              || frontmatterScalar(content, "fixture_preservation_marker"),
            );
          }

          function fixtureLooksCurrent(content, item) {
            const coverPath = coverRelativePath(item).split(path.sep).join("/");
            return content.includes(`fixture_version: ${TEST_FIXTURE_VERSION}`)
              && content.includes(`source_provider: ${yamlScalar(item.sourceProvider)}`)
              && content.includes(`source_id: ${yamlScalar(item.sourceId)}`)
              && content.includes(`cover: ${yamlScalar(coverPath)}`)
              && content.includes(`cover_remote: ${yamlScalar(item.coverRemote)}`);
          }

          function legacyGeneratedFixture(content) {
            const title = frontmatterScalar(content, "title");
            return isFixtureManaged(content)
              || /Generated test fixture|Shared Test Vault fixture based on a real collected work/.test(content)
              || /^(?:TEST|SPECIAL)(?:\s|$)/.test(title);
          }

          function removeEmptyDirectories(root) {
            if (!fs.existsSync(root)) return;
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (entry.isDirectory()) removeEmptyDirectories(path.join(root, entry.name));
            }
            if (fs.existsSync(root) && fs.readdirSync(root).length === 0) fs.rmdirSync(root);
          }

          function cleanupLegacyGeneratedFixtures(vaultRoot) {
            const legacyRoot = path.join(vaultRoot, TEST_LIBRARY_ROOT, "Test Fixtures");
            if (!fs.existsSync(legacyRoot)) return 0;
            let removed = 0;
            const visit = (folder) => {
              for (const entry of fs.readdirSync(folder, { withFileTypes: true })) {
                const filePath = path.join(folder, entry.name);
                if (entry.isDirectory()) {
                  visit(filePath);
                  continue;
                }
                if (!entry.isFile() || !entry.name.endsWith(".md")) continue;
                const content = fs.readFileSync(filePath, "utf8");
                if (!legacyGeneratedFixture(content)) continue;
                fs.rmSync(filePath);
                removed += 1;
              }
            };
            visit(legacyRoot);
            removeEmptyDirectories(legacyRoot);
            return removed;
          }

          function uniqueMediaRelativePath(vaultRoot, preferredRelativePath) {
            if (!fs.existsSync(path.join(vaultRoot, preferredRelativePath))) return preferredRelativePath;
            const extension = path.extname(preferredRelativePath);
            const stem = preferredRelativePath.slice(0, -extension.length);
            let index = 2;
            while (fs.existsSync(path.join(vaultRoot, `${stem} (${index})${extension}`))) index += 1;
            return `${stem} (${index})${extension}`;
          }

          async function downloadCoverTo(vaultRoot, relative, remoteUrl, title, fetchImpl) {
            const target = path.join(vaultRoot, relative);
            const existing = fs.statSync(target, { throwIfNoEntry: false });
            if (existing?.isFile() && existing.size > 0) return { path: target, downloaded: false };
            fs.mkdirSync(path.dirname(target), { recursive: true });
            const response = await fetchImpl(remoteUrl, {
              headers: {
                Accept: "image/avif,image/webp,image/png,image/jpeg,*/*",
                "User-Agent": "AnimeList-Test-Vault/1.0",
              },
            });
            if (!response.ok) throw new Error(`Cover download failed (${response.status}) for ${title}`);
            const contentType = response.headers?.get?.("content-type") ?? "";
            if (contentType && !/^image\//i.test(contentType)) {
              throw new Error(`Unexpected cover content type ${contentType} for ${title}`);
            }
            const buffer = Buffer.from(await response.arrayBuffer());
            if (!buffer.length) throw new Error(`Empty cover response for ${title}`);
            fs.writeFileSync(target, buffer);
            return { path: target, downloaded: true };
          }

          async function ensureExistingNoteCover(vaultRoot, existingContent, item, fetchImpl) {
            const recordedCover = frontmatterScalar(existingContent, "cover").replace(/\\/g, "/");
            if (!recordedCover || /^https?:\/\//i.test(recordedCover)) return { downloaded: false };
            const remote = frontmatterScalar(existingContent, "cover_remote") || item.coverRemote;
            if (!remote) return { downloaded: false };
            return downloadCoverTo(vaultRoot, recordedCover, remote, item.title, fetchImpl);
          }

          async function downloadFixtureCover(vaultRoot, item, fetchImpl) {
            return downloadCoverTo(vaultRoot, coverRelativePath(item), item.coverRemote, item.title, fetchImpl);
          }
          '''
          s = s[:helper_start] + helpers + '\n\n' + s[helper_end:]

          prepare_start = s.index('export async function prepareTestFixtures(vaultRoot, options = {}) {')
          prepare_end = s.index('function defaultVaultRoot() {')
          prepare = r'''export async function prepareTestFixtures(vaultRoot, options = {}) {
            const resolvedVault = path.resolve(vaultRoot);
            const reset = options.reset === true;
            const fetchImpl = options.fetchImpl ?? globalThis.fetch;
            if (typeof fetchImpl !== "function") throw new Error("Test Vault cover preparation requires fetch().");

            const files = [];
            let created = 0;
            let reused = 0;
            let repaired = 0;
            let coversDownloaded = 0;
            let reusedBySource = 0;
            const legacyRemoved = cleanupLegacyGeneratedFixtures(resolvedVault);
            const bySource = scanManagedSourceNotes(resolvedVault);

            for (const fixture of FIXTURES) {
              const key = sourceKey(fixture.sourceProvider, fixture.sourceId);
              const sourceMatch = bySource.get(key);

              if (sourceMatch) {
                const managedFixture = isFixtureManaged(sourceMatch.content);
                if (!reset || !managedFixture) {
                  const cover = await ensureExistingNoteCover(resolvedVault, sourceMatch.content, fixture, fetchImpl);
                  if (cover.downloaded) coversDownloaded += 1;
                  files.push(sourceMatch.filePath);
                  reused += 1;
                  if (sourceMatch.filePath !== path.join(resolvedVault, fixtureRelativePath(fixture))) reusedBySource += 1;
                  continue;
                }

                const cover = await downloadFixtureCover(resolvedVault, fixture, fetchImpl);
                if (cover.downloaded) coversDownloaded += 1;
                const content = mediaNote(fixture);
                writeFile(resolvedVault, path.relative(resolvedVault, sourceMatch.filePath), content);
                files.push(sourceMatch.filePath);
                repaired += 1;
                bySource.set(key, { filePath: sourceMatch.filePath, content });
                continue;
              }

              const preferredRelativePath = fixtureRelativePath(fixture);
              const relativePath = uniqueMediaRelativePath(resolvedVault, preferredRelativePath);
              const target = path.join(resolvedVault, relativePath);
              const cover = await downloadFixtureCover(resolvedVault, fixture, fetchImpl);
              if (cover.downloaded) coversDownloaded += 1;
              const content = mediaNote(fixture);
              writeFile(resolvedVault, relativePath, content);
              files.push(target);
              created += 1;
              bySource.set(key, { filePath: target, content });
            }

            const checklistPath = writeFile(resolvedVault, TEST_CHECKLIST_PATH, checklistContent());
            return {
              fixtureRoot: path.join(resolvedVault, TEST_LIBRARY_ROOT),
              checklistPath,
              files,
              created,
              reused,
              reusedBySource,
              repaired,
              coversDownloaded,
              legacyRemoved,
            };
          }

          '''
          s = s[:prepare_start] + prepare + s[prepare_end:]
          fixture.write_text(s)

          runner = Path('scripts/test-vault.mjs')
          r = runner.read_text()
          old = 'console.log(`Fixture preparation: created=${fixtures.created}, reused=${fixtures.reused}, repaired=${fixtures.repaired}, covers downloaded=${fixtures.coversDownloaded}`);'
          new = 'console.log(`Fixture preparation: created=${fixtures.created}, reused=${fixtures.reused}, reused by source=${fixtures.reusedBySource}, repaired=${fixtures.repaired}, covers downloaded=${fixtures.coversDownloaded}, legacy removed=${fixtures.legacyRemoved}`);'
          if old not in r: raise SystemExit('test-vault summary line not found')
          runner.write_text(r.replace(old, new))

          checker = Path('scripts/check-test-vault-fixtures.mjs')
          c = checker.read_text()
          marker = '  assert.equal(first.coversDownloaded, 18);\n'
          if marker not in c: raise SystemExit('checker first-run marker not found')
          c = c.replace(marker, marker + '  assert.equal(first.reusedBySource, 0);\n  assert.equal(first.legacyRemoved, 0);\n', 1)

          start = c.index('  // Ordinary test-vault startup is non-destructive once a collected fixture is current.')
          end = c.index('  // A missing cached cover is repaired without rewriting the note.', start)
          source_block = '''  // Ordinary test-vault startup is non-destructive once a collected fixture is current.\n  fs.appendFileSync(path.join(vaultRoot, alyaPath), "\\nUSER EDIT MUST SURVIVE\\n");\n  fetchCalls = 0;\n  const second = await prepareTestFixtures(vaultRoot, { reset: false, fetchImpl: fakeFetch });\n  assert.equal(second.created, 0);\n  assert.equal(second.repaired, 0);\n  assert.equal(second.reused, 18);\n  assert.equal(second.reusedBySource, 0);\n  assert.equal(second.coversDownloaded, 0);\n  assert.equal(fetchCalls, 0);\n  assert.match(read(alyaPath), /USER EDIT MUST SURVIVE/);\n\n  // Match the real MediaRepository.findBySource contract: a normally collected work at a different\n  // managed filename/subfolder must be reused by provider + source ID rather than duplicated.\n  const originalFrierenPath = path.join(vaultRoot, frierenMangaPath);\n  const customFrierenPath = path.join(vaultRoot, "AnimeList", "Manga", "Imported", "我已收藏的芙莉蓮.md");\n  fs.mkdirSync(path.dirname(customFrierenPath), { recursive: true });\n  const normalCollectedFrieren = fs.readFileSync(originalFrierenPath, "utf8")\n    .replace(/^fixture_version:.*\\n/m, "")\n    .replace(/^fixture_case:.*\\n/m, "")\n    .replace(/> Shared Test Vault fixture based on a real collected work[^\\n]*\\n?/, "> USER-COLLECTED NOTE MUST SURVIVE\\n");\n  fs.writeFileSync(customFrierenPath, normalCollectedFrieren);\n  fs.rmSync(originalFrierenPath);\n  fetchCalls = 0;\n  const sourceReuse = await prepareTestFixtures(vaultRoot, { reset: false, fetchImpl: fakeFetch });\n  assert.equal(sourceReuse.created, 0);\n  assert.equal(sourceReuse.repaired, 0);\n  assert.equal(sourceReuse.reused, 18);\n  assert.equal(sourceReuse.reusedBySource, 1);\n  assert.equal(sourceReuse.coversDownloaded, 0);\n  assert.equal(fetchCalls, 0);\n  assert.equal(fs.existsSync(originalFrierenPath), false);\n  assert.equal(fs.existsSync(customFrierenPath), true);\n  assert.match(fs.readFileSync(customFrierenPath, "utf8"), /USER-COLLECTED NOTE MUST SURVIVE/);\n  const frierenSourceMatches = allMarkdown(path.join(vaultRoot, "AnimeList", "Manga"))\n    .filter((file) => /source_id: "305429"/.test(fs.readFileSync(file, "utf8")));\n  assert.equal(frierenSourceMatches.length, 1);\n\n'''
          c = c[:start] + source_block + c[end:]

          reset_start = c.index('  // Explicit reset restores only the known fixtures; unrelated user-created test files survive.')
          reset_end = c.index('\n} finally {', reset_start)
          reset_block = '''  // Legacy generated Test Fixtures are migrated away without deleting unknown/manual files.\n  const legacyRoot = path.join(vaultRoot, "AnimeList", "Test Fixtures", "Manga");\n  fs.mkdirSync(legacyRoot, { recursive: true });\n  const legacyGenerated = path.join(legacyRoot, "old-generated.md");\n  const legacyManual = path.join(legacyRoot, "keep-manual.md");\n  fs.writeFileSync(legacyGenerated, '---\\ntitle: "TEST old fixture"\\nmedia_type: "manga"\\n---\\n> Generated test fixture.\\n');\n  fs.writeFileSync(legacyManual, '# manual legacy-folder note\\n');\n  const legacyCleanup = await prepareTestFixtures(vaultRoot, { reset: false, fetchImpl: fakeFetch });\n  assert.equal(legacyCleanup.legacyRemoved, 1);\n  assert.equal(fs.existsSync(legacyGenerated), false);\n  assert.equal(fs.existsSync(legacyManual), true);\n\n  // Explicit reset restores only fixture-managed notes; a normal same-source user note is preserved.\n  const unrelated = path.join(vaultRoot, "AnimeList", "Novel", "My manual test note.md");\n  fs.writeFileSync(unrelated, "# keep me\\n");\n  const reset = await prepareTestFixtures(vaultRoot, { reset: true, fetchImpl: fakeFetch });\n  assert.equal(reset.files.length, 18);\n  assert.equal(fs.existsSync(unrelated), true);\n  assert.doesNotMatch(read(alyaPath), /USER EDIT MUST SURVIVE/);\n  assert.equal(reset.repaired, 17);\n  assert.equal(reset.reused, 1);\n  assert.equal(reset.reusedBySource, 1);\n  assert.equal(fs.existsSync(originalFrierenPath), false);\n  assert.match(fs.readFileSync(customFrierenPath, "utf8"), /USER-COLLECTED NOTE MUST SURVIVE/);\n\n  console.log("Shared Test Vault mirrors collected media: source-ID reuse, real local covers, non-destructive startup, explicit fixture-only reset.");\n'''
          c = c[:reset_start] + reset_block + c[reset_end:]
          checker.write_text(c)

          contributing = Path('CONTRIBUTING.md')
          d = contributing.read_text()
          old_doc = '`npm run test-vault` is intentionally non-destructive for media data. Existing current fixtures and downloaded covers are reused, so edits made during manual testing survive reopening the vault and duplicate media are not created. A missing cached cover is repaired without rewriting the note.'
          new_doc = '`npm run test-vault` is intentionally non-destructive for media data. Existing collected works are resolved by `source_provider` + `source_id` across the managed media folders even when the note was renamed or moved into a subfolder. Those notes and downloaded covers are reused, so edits made during manual testing survive reopening the vault and duplicate media are not created. A missing cached cover is repaired from the note\'s recorded cover metadata without rewriting the note.'
          if old_doc not in d: raise SystemExit('CONTRIBUTING paragraph not found')
          contributing.write_text(d.replace(old_doc, new_doc))
          PY
          node scripts/check-test-vault-fixtures.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run release:check

      - name: Run exact fresh production Test Vault
        shell: bash
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: |
          set -euo pipefail
          rm -rf test-vault
          npm run test-vault | tee /tmp/test-vault-first.log
          grep -q 'Shared works: 18' /tmp/test-vault-first.log
          grep -q 'created=18, reused=0, reused by source=0, repaired=0, covers downloaded=18' /tmp/test-vault-first.log
          test "$(find test-vault/AnimeList/Covers -type f -name '*.jpg' | wc -l)" -eq 18
          python <<'PY'
          from pathlib import Path
          covers=list(Path('test-vault/AnimeList/Covers').rglob('*.jpg'))
          assert len(covers)==18
          for cover in covers:
              data=cover.read_bytes()
              assert len(data)>1000, (cover, len(data))
              assert data[:3] == b'\xff\xd8\xff', (cover, data[:8])
          print('18 real JPEG covers verified')
          PY

      - name: Verify real source-ID reuse after rename and move
        shell: bash
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: |
          set -euo pipefail
          ORIGINAL='test-vault/AnimeList/Manga/葬送的芙莉蓮.md'
          MOVED='test-vault/AnimeList/Manga/Imported/我已收藏的芙莉蓮.md'
          mkdir -p "$(dirname "$MOVED")"
          python <<'PY'
          from pathlib import Path
          source=Path('test-vault/AnimeList/Manga/葬送的芙莉蓮.md')
          target=Path('test-vault/AnimeList/Manga/Imported/我已收藏的芙莉蓮.md')
          text=source.read_text()
          text='\n'.join(line for line in text.splitlines() if not line.startswith('fixture_version:') and not line.startswith('fixture_case:'))+'\n\nUSER-COLLECTED NOTE MUST SURVIVE\n'
          target.write_text(text)
          source.unlink()
          PY
          node scripts/test-vault.mjs production --no-open | tee /tmp/test-vault-source-reuse.log
          grep -q 'created=0, reused=18, reused by source=1, repaired=0, covers downloaded=0' /tmp/test-vault-source-reuse.log
          test ! -e "$ORIGINAL"
          test -s "$MOVED"
          grep -q 'USER-COLLECTED NOTE MUST SURVIVE' "$MOVED"
          test "$(grep -R -l '^source_id: "305429"$' test-vault/AnimeList/Manga --include='*.md' | wc -l)" -eq 1

      - name: Verify cover repair does not rewrite source-matched notes
        shell: bash
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: |
          set -euo pipefail
          NOTE='test-vault/AnimeList/Novel/不時以俄語遮羞的艾莉同學.md'
          COVER='test-vault/AnimeList/Covers/novel/不時以俄語遮羞的艾莉同學-bangumi-339092.jpg'
          printf '\nANOTHER USER EDIT MUST SURVIVE\n' >> "$NOTE"
          rm "$COVER"
          node scripts/test-vault.mjs production --no-open | tee /tmp/test-vault-cover-repair.log
          grep -q 'created=0, reused=18, reused by source=1, repaired=0, covers downloaded=1' /tmp/test-vault-cover-repair.log
          grep -q 'ANOTHER USER EDIT MUST SURVIVE' "$NOTE"
          test -s "$COVER"

      - name: Commit only the final tooling fix
        shell: bash
        run: |
          set -euo pipefail
          BASE='586f590a3b621bdd83899ec594d536717208d0c8'
          STAGING="$(git rev-parse HEAD)"
          git fetch origin feature/release-tracking
          test "$(git rev-parse origin/feature/release-tracking)" = "$STAGING"
          git diff -- CONTRIBUTING.md scripts/test-vault-fixtures.mjs scripts/test-vault.mjs scripts/check-test-vault-fixtures.mjs > /tmp/source-reuse.patch
          test -s /tmp/source-reuse.patch
          git checkout -B feature/release-tracking "$BASE"
          git apply --check /tmp/source-reuse.patch
          git apply /tmp/source-reuse.patch
          node scripts/check-test-vault-fixtures.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONTRIBUTING.md scripts/test-vault-fixtures.mjs scripts/test-vault.mjs scripts/check-test-vault-fixtures.mjs
          git commit -m 'test: reuse shared test-vault media by source identity'
          git push --force-with-lease=refs/heads/feature/release-tracking:"$STAGING" origin HEAD:feature/release-tracking
