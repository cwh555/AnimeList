name: Validate and publish serial cover direct card apply
run-name: Validate serial cover direct card apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/serial-cover-direct-card-apply
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify base and apply exact product patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_FEATURE=2bb9d2d2855c55a4619b4d3abbadd08271144d5c
          git fetch origin feature/serial-entry-covers fix/serial-cover-direct-card-apply
          test "$(git rev-parse origin/feature/serial-entry-covers)" = "$EXPECTED_FEATURE"
          test "$(git merge-base HEAD origin/feature/serial-entry-covers)" = "$EXPECTED_FEATURE"

          mapfile -t staged < <(git diff --name-only "$EXPECTED_FEATURE"...HEAD | sort)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 5
          test "${staged[0]}" = ".github/direct-apply-patch/chunk-00"
          test "${staged[1]}" = ".github/direct-apply-patch/chunk-01"
          test "${staged[2]}" = ".github/direct-apply-patch/chunk-02"
          test "${staged[3]}" = ".github/direct-apply-patch/chunk-03"
          test "${staged[4]}" = ".github/workflows/validate-serial-cover-direct-apply.yml"

          cat .github/direct-apply-patch/chunk-* > /tmp/direct-apply.patch.gz.b64
          echo "4fdb411e4371783b7386ee70a29fdf35b035e18791c7dcbfdc8295614bf79007  /tmp/direct-apply.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/direct-apply.patch.gz.b64 | gzip --decompress > /tmp/direct-apply.patch
          echo "92902f9dbd1ccbcb2de38c109202dea201c905b08052a453a61cc71efadd9fc3  /tmp/direct-apply.patch" | sha256sum --check
          patch -p1 < /tmp/direct-apply.patch

          rm -rf .github/direct-apply-patch
          rm -f .github/workflows/validate-serial-cover-direct-apply.yml
      - name: Install dependencies
        run: npm ci
      - name: Run standard checks
        run: npm run check
      - name: Run real Chromium card interaction
        run: npm run test:browser
      - name: Run release check
        run: npm run release:check
      - name: Build production Test Vault
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: npm run test-vault
      - name: Run live Bangumi manual and automatic cover probes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/obsidian-live-stub.ts <<'TS'
          export class TFile {}
          export async function requestUrl(options: {
            url: string;
            method?: string;
            headers?: Record<string, string>;
            body?: string;
          }): Promise<{ text: string; json: unknown; status: number; headers: Headers }> {
            const response = await fetch(options.url, {
              method: options.method ?? "GET",
              headers: options.headers,
              body: options.body,
            });
            const text = await response.text();
            let json: unknown = null;
            try { json = text ? JSON.parse(text) : null; } catch { json = null; }
            if (!response.ok) {
              const error = new Error(`HTTP ${response.status} for ${options.url}`) as Error & {
                status?: number;
                response?: { status: number; headers: Headers };
              };
              error.status = response.status;
              error.response = { status: response.status, headers: response.headers };
              throw error;
            }
            return { text, json, status: response.status, headers: response.headers };
          }
          TS

          mkdir -p .tmp
          cat > .tmp/serial-cover-live-probe.ts <<'TS'
          (globalThis as typeof globalThis & { window: typeof globalThis }).window = globalThis;

          const {
            clearSerialCoverProviderCache,
            configureSerialCoverProviderForTests,
            searchManualSerialCovers,
            searchSerialCovers,
          } = await import("../src/serial-cover-provider");
          const {
            confidentSerialCover,
            manualSerialCoverQueries,
            serialCoverQuery,
          } = await import("../src/serial-entry-cover");

          configureSerialCoverProviderForTests({
            sleep: (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds)),
            random: () => 0,
          });

          async function checkCover(url: string): Promise<{ status: number; bytes: number }> {
            const response = await fetch(url, { headers: { Range: "bytes=0-255" } });
            const bytes = (await response.arrayBuffer()).byteLength;
            if (!(response.ok || response.status === 206) || bytes < 1) {
              throw new Error(`Cover fetch failed: ${response.status} ${bytes} ${url}`);
            }
            return { status: response.status, bytes };
          }

          const report: {
            manual: unknown[];
            automatic: unknown[];
          } = { manual: [], automatic: [] };

          const manualTitles = [
            "關於我被隔壁天使變成廢材這件事",
            "不時以俄語遮羞的艾利同學",
            "冰菓",
          ];

          for (const title of manualTitles) {
            clearSerialCoverProviderCache();
            const label = "1";
            const query = serialCoverQuery(title, label);
            if (!query) throw new Error(`Could not build manual query for ${title}`);
            const candidates = await searchManualSerialCovers(query, title, label, "novel");
            if (candidates.length < 1) throw new Error(`Manual search returned no candidates for ${title}`);
            const visible = candidates.slice(0, 8);
            if (visible.some((candidate) => !candidate.coverUrl)) {
              throw new Error(`Manual search returned a candidate without cover for ${title}`);
            }
            const coverCheck = await checkCover(visible[0].coverUrl);
            report.manual.push({
              title,
              queries: manualSerialCoverQueries(title, label),
              candidateCount: candidates.length,
              topCandidates: visible.map((candidate) => ({
                sourceId: candidate.sourceId,
                title: candidate.title,
                mediaTypeHint: candidate.mediaTypeHint,
                score: candidate.score,
                coverUrl: candidate.coverUrl,
              })),
              topCoverCheck: coverCheck,
            });
          }

          const expected = new Map<string, string>([
            ["14", "223981"],
            ["15", "223980"],
            ["16", "260752"],
            ["17", "260753"],
            ["18", "260754"],
            ["19", "260755"],
            ["20", "267778"],
            ["21", "277156"],
            ["22", "287149"],
            ["23", "305455"],
            ["24", "321201"],
            ["25", "348137"],
            ["26", "403823"],
          ]);
          const originalTitle = "無職転生 ~異世界行ったら本気だす~";
          for (const [label, expectedId] of expected) {
            clearSerialCoverProviderCache();
            const query = serialCoverQuery(originalTitle, label);
            if (!query) throw new Error(`Could not build automatic query for volume ${label}`);
            const candidates = await searchSerialCovers(query, originalTitle, label, "novel");
            const confident = confidentSerialCover(candidates);
            if (!confident) throw new Error(`No confident automatic candidate for Mushoku volume ${label}`);
            if (confident.sourceId !== expectedId) {
              throw new Error(`Wrong Mushoku volume ${label}: expected ${expectedId}, got ${confident.sourceId} ${confident.title}`);
            }
            const coverCheck = await checkCover(confident.coverUrl);
            report.automatic.push({
              label,
              expectedId,
              sourceId: confident.sourceId,
              title: confident.title,
              score: confident.score,
              coverCheck,
            });
          }

          await import("node:fs/promises").then(({ writeFile }) => (
            writeFile("serial-cover-live-report.json", JSON.stringify(report, null, 2) + "\n")
          ));
          console.log(JSON.stringify(report, null, 2));
          TS

          node --input-type=module <<'NODE'
          import { build } from "esbuild";
          await build({
            entryPoints: [".tmp/serial-cover-live-probe.ts"],
            outfile: "/tmp/serial-cover-live-probe.mjs",
            bundle: true,
            platform: "node",
            format: "esm",
            target: "node24",
            plugins: [{
              name: "obsidian-live-stub",
              setup(build) {
                build.onResolve({ filter: /^obsidian$/ }, () => ({ path: "/tmp/obsidian-live-stub.ts" }));
              },
            }],
          });
          NODE
          node /tmp/serial-cover-live-probe.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: serial-cover-direct-apply-live-report
          path: serial-cover-live-report.json
          retention-days: 7
      - name: Publish validated product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f serial-cover-live-report.json
          mapfile -t unexpected < <(git status --porcelain | sed 's/^...//' | grep '^\.github/' || true)
          test "${#unexpected[@]}" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply serial covers directly from search cards"
          git push origin HEAD:fix/serial-cover-direct-card-apply
