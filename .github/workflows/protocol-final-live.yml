name: Exact candidate live publication and image decoding verification
on:
  push:
    branches: [research/protocol-final-live-recheck]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow
      - run: node scripts/probe-final-publications.mjs
      - name: Decode downloaded images
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          results=[]
          for path in sorted(Path("protocol-audit/images").glob("*")):
              try:
                  with Image.open(path) as image:
                      image.load()
                      results.append({"file": path.name, "format":image.format,"size":image.size,"ok":True})
              except Exception as e:
                  results.append({"file":path.name,"ok":False,"error":str(e)})
          print("LIVE_DECODE "+json.dumps(results))
          assert len(results)==59 and all(x["ok"] for x in results)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-publication-report
          path: protocol-audit/results.json
