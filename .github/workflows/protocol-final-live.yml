name: Exact candidate live publication and image decoding verification
on:
  push:
    branches: [research/protocol-final-live-verification]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow
      - run: node scripts/probe-raw-publications.mjs
