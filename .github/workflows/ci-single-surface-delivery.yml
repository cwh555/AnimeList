name: Single-surface validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'ci/single-surface-refactor' && github.base_ref == 'feature/component-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/single-surface-refactor
          fetch-depth: 0

      - name: Reconstruct and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_base=94e5a48cfdfa25a90ecdcf7ee2423ab1252cc8fe
          remote_base=$(git ls-remote origin refs/heads/feature/component-polish | cut -f1)
          test "$remote_base" = "$expected_base"
          cat .github/ci-single-surface/part-* > /tmp/candidate.patch.gz.b64
          echo 'a0bc4428d890515ec1bb4860f5bb4bbec520c9ecac5ca049dc7bf645473abf9c  /tmp/candidate.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/candidate.patch.gz.b64 > /tmp/candidate.patch.gz
          echo '9b9e984f69539ad01f3717c12c917c0d0b2e57227c8df98ec7150fdc8f9129fb  /tmp/candidate.patch.gz' | sha256sum -c -
          gzip -dc /tmp/candidate.patch.gz > /tmp/candidate.patch
          echo 'b1324f1892527b54229c7e491594ac0b6294751537a4f419e8360d3f296bfb26  /tmp/candidate.patch' | sha256sum -c -
          git checkout --detach "$expected_base"
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          test "$(git hash-object src/ui/image-section-surface-handoff.ts)" = a20fe04668e36fc663251bb8278e26977da45580
          test "$(git hash-object src/ui/image-section-continuity.ts)" = f101ec383b45726e581e3daeede084bcf751a4f8
          test "$(git hash-object src/ui/image-section-renderer.ts)" = fbf5a98bad109405456354786d0041ac9a9ee1fd
          test "$(git hash-object scripts/check-image-section-host-continuity.mjs)" = 30590a1f56b29af058721d70f2afdf8de6ce0eef
          test "$(git hash-object scripts/check-architecture.mjs)" = 46c1cd8bdca66f2444ea51a456da93d78cbbd1b1
          test ! -e src/ui/image-section-visual-handoff.ts
          git add -N src/ui/image-section-surface-handoff.ts
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/check-architecture.mjs scripts/check-image-section-host-continuity.mjs src/ui/image-section-continuity.ts src/ui/image-section-renderer.ts src/ui/image-section-surface-handoff.ts src/ui/image-section-visual-handoff.ts "

      - name: Pack exact materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/single-surface-candidate/src/ui /tmp/single-surface-candidate/scripts
          cp src/ui/image-section-surface-handoff.ts /tmp/single-surface-candidate/src/ui/
          cp src/ui/image-section-continuity.ts /tmp/single-surface-candidate/src/ui/
          cp src/ui/image-section-renderer.ts /tmp/single-surface-candidate/src/ui/
          cp scripts/check-image-section-host-continuity.mjs /tmp/single-surface-candidate/scripts/
          cp scripts/check-architecture.mjs /tmp/single-surface-candidate/scripts/
          cat > /tmp/single-surface-candidate/MANIFEST.txt <<'EOF'
          base=94e5a48cfdfa25a90ecdcf7ee2423ab1252cc8fe
          delete=src/ui/image-section-visual-handoff.ts
          src/ui/image-section-surface-handoff.ts=a20fe04668e36fc663251bb8278e26977da45580
          src/ui/image-section-continuity.ts=f101ec383b45726e581e3daeede084bcf751a4f8
          src/ui/image-section-renderer.ts=fbf5a98bad109405456354786d0041ac9a9ee1fd
          scripts/check-image-section-host-continuity.mjs=30590a1f56b29af058721d70f2afdf8de6ce0eef
          scripts/check-architecture.mjs=46c1cd8bdca66f2444ea51a456da93d78cbbd1b1
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: single-surface-materialized-candidate
          path: /tmp/single-surface-candidate
          if-no-files-found: error
          retention-days: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Full project checks
        run: npm run check

      - name: Single-surface Chromium regression
        run: ANIMELIST_REQUIRE_CHROMIUM=1 node scripts/check-image-section-host-continuity.mjs

      - name: Persistence queue Chromium regression
        run: ANIMELIST_REQUIRE_CHROMIUM=1 node scripts/check-image-section-move-commit-queue.mjs

      - name: Release checks
        run: npm run release:check
