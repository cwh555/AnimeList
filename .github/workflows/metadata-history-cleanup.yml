name: Guarded metadata history cleanup

on:
  push:
    branches:
      - staging/anilist-metadata-clean-history2-20260805

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rebuild, validate, and publish clean feature history
        run: |
          cat .publish/script-* > /tmp/guard.sh
          bash /tmp/guard.sh
