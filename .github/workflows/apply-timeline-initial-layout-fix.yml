name: Finalize timeline initial layout fix

on:
  pull_request:
    branches:
      - preview
    paths:
      - .github/workflows/apply-timeline-initial-layout-fix.yml

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.head_ref == 'fix/timeline-initial-layout-and-units'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/timeline-initial-layout-and-units
          fetch-depth: 0

      - name: Replace brittle wording-location assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/core.test.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '} from "../src/timeline-scale";\n',
                  '} from "../src/timeline-scale";\nimport { timelineSerialEventTitle } from "../src/timeline-entry";\n',
              ),
              (
                  '    const novelSource = readFileSync(path.join(process.cwd(), "src/novel-progress.ts"), "utf8");\n',
                  '',
              ),
              (
                  '    const runtimeSources = [legacySource, mainSource, templateSource, novelSource, settingsSource];\n',
                  '    const runtimeSources = [legacySource, mainSource, templateSource, settingsSource];\n',
              ),
              (
                  '    assert.match(novelSource, /uiText\\("timeline\\.novelEventTitle"/);\n',
                  '    assert.equal(\n'
                  '      timelineSerialEventTitle({ title: "作品", mediaType: "manga", unit: "chapter" }, "12"),\n'
                  '      "作品 — 第 12 話",\n'
                  '    );\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply-timeline-initial-layout-fix.yml").unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run complete checks
        run: npm run check

      - name: Run release checks
        run: npm run release:check

      - name: Build production Test Vault
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: node scripts/test-vault.mjs production

      - name: Publish validated final commit
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core.test.ts .github/workflows/apply-timeline-initial-layout-fix.yml
          git commit -m "test: validate timeline wording behavior"
          git push origin HEAD:fix/timeline-initial-layout-and-units
