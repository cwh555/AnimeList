name: Apply timeline date-group fix

on:
  push:
    branches:
      - feature/fix-timeline-layout
    paths:
      - scripts/apply-timeline-date-group-fix.mjs
      - .github/workflows/apply-timeline-date-group-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fix-timeline-layout
          fetch-depth: 0
      - name: Apply patch and remove temporary tooling
        run: |
          node scripts/apply-timeline-date-group-fix.mjs
          rm scripts/apply-timeline-date-group-fix.mjs
          rm .github/workflows/apply-timeline-date-group-fix.yml
      - name: Commit corrected behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy.ts src/timeline-corrections.ts tests/timeline-corrections.test.ts tests/timeline-scale.test.ts scripts/apply-timeline-date-group-fix.mjs .github/workflows/apply-timeline-date-group-fix.yml
          git commit -m "fix: preserve same-day timeline stacks"
          git push origin HEAD:feature/fix-timeline-layout
