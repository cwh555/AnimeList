name: Validate and publish serial cover picker fix
run-name: Final serial cover picker and migration UI validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/serial-cover-picker-and-migration-ui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply exact product patch
        run: |
          base64 --decode .github/serial-cover-final.patch.gz.b64 | gzip --decompress > /tmp/serial-cover-final.patch
          patch -p1 < /tmp/serial-cover-final.patch
          rm -f \
            .github/serial-cover-final.patch.gz.b64 \
            .github/serial-cover-fix-export-trigger.txt \
            .github/workflows/export-serial-cover-fix-env.yml \
            .github/workflows/apply-serial-cover-final-fix.yml
      - name: Install dependencies
        run: npm ci
      - name: Run standard checks
        run: npm run check
      - name: Run required Chromium interaction test
        run: npm run test:browser
      - name: Run release check
        run: npm run release:check
      - name: Build production Test Vault
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: npm run test-vault
      - name: Publish validated product commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebuild serial cover selection and migration UI"
          git push origin HEAD:fix/serial-cover-picker-and-migration-ui
