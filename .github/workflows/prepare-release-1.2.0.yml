name: Prepare release 1.2.0

on:
  push:
    branches: [release/1.2.0]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.2.0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify starting point
        run: |
          test "$(git rev-parse HEAD^)" = "3db527b02b5b487a0b0a2a8fb5f6a2b455a8fe61"
      - name: Synchronize version metadata
        run: |
          npm version 1.2.0 --no-git-tag-version --allow-same-version
          node <<'NODE'
          import fs from "node:fs";

          const replaceExactly = (path, before, after) => {
            const source = fs.readFileSync(path, "utf8");
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) {
              throw new Error(`${path}: expected one occurrence of ${JSON.stringify(before)}, found ${occurrences}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          };

          replaceExactly(
            "src/main.ts",
            'const PLUGIN_VERSION = "1.1.2";',
            'const PLUGIN_VERSION = "1.2.0";',
          );
          replaceExactly(
            "src/legacy.ts",
            'const PLUGIN_VERSION = "1.1.2";',
            'const PLUGIN_VERSION = "1.2.0";',
          );

          const testPath = "tests/core.test.ts";
          let testSource = fs.readFileSync(testPath, "utf8");
          const replacements = [
            ['assert.equal(manifest.version, "1.1.2");', 'assert.equal(manifest.version, "1.2.0");'],
            ['assert.match(mainSource, /const PLUGIN_VERSION = "1\\.1\\.2";/);', 'assert.match(mainSource, /const PLUGIN_VERSION = "1\\.2\\.0";/);'],
            ['assert.match(legacySource, /const PLUGIN_VERSION = "1\\.1\\.2";/);', 'assert.match(legacySource, /const PLUGIN_VERSION = "1\\.2\\.0";/);'],
          ];
          for (const [before, after] of replacements) {
            const occurrences = testSource.split(before).length - 1;
            if (occurrences !== 1) {
              throw new Error(`${testPath}: expected one occurrence of ${JSON.stringify(before)}, found ${occurrences}`);
            }
            testSource = testSource.replace(before, after);
          }
          fs.writeFileSync(testPath, testSource);
          NODE
          rm .github/workflows/prepare-release-1.2.0.yml
      - name: Install dependencies
        run: npm ci
      - name: Run project checks
        run: npm run check
      - name: Run release checks
        run: npm run release:check
      - name: Build Test Vault without opening Obsidian
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: npm run test-vault
      - name: Verify synchronized release metadata
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const expected = "1.2.0";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
          const main = fs.readFileSync("src/main.ts", "utf8");
          const legacy = fs.readFileSync("src/legacy.ts", "utf8");
          const coreTest = fs.readFileSync("tests/core.test.ts", "utf8");
          const failures = [];
          if (pkg.version !== expected) failures.push("package.json");
          if (lock.version !== expected || lock.packages?.[""]?.version !== expected) failures.push("package-lock.json");
          if (manifest.version !== expected) failures.push("manifest.json");
          if (versions[expected] !== manifest.minAppVersion) failures.push("versions.json");
          if (!main.includes(`const PLUGIN_VERSION = "${expected}";`)) failures.push("src/main.ts");
          if (!legacy.includes(`const PLUGIN_VERSION = "${expected}";`)) failures.push("src/legacy.ts");
          if (!coreTest.includes(`assert.equal(manifest.version, "${expected}");`)) failures.push("tests/core.test.ts");
          if (failures.length) throw new Error(`Unsynchronized version files: ${failures.join(", ")}`);
          NODE
          test ! -e .github/workflows/prepare-release-1.2.0.yml
          git diff --check
      - name: Commit validated release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json src/main.ts src/legacy.ts tests/core.test.ts .github/workflows/prepare-release-1.2.0.yml
          git commit -m "chore: prepare 1.2.0 release"
          git push origin HEAD:release/1.2.0
