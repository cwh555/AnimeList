name: Volume provider benchmark
on:
  push:
    branches: [research/volume-cover-benchmark]
permissions:
  contents: read
jobs:
  live-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/diagnose-volume-providers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volume-provider-responses
          path: volume-benchmark/
