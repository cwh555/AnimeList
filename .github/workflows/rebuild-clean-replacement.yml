name: Rebuild clean bugfix replacement

on:
  push:
    branches:
      - fix/filter-tag-clear-all
    paths:
      - .github/workflows/rebuild-clean-replacement.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify payload and fast-forward replacement branch
        shell: bash
        run: |
          set -euo pipefail

          BASE_HEAD=1532e23ec96568f7926df9c55227b97b94e14bfe
          EXPECTED_PREVIEW=86ab2262c4b7a588e676d283e87e4ab4e12506b1
          TARGET_BRANCH=fix/library-filter-garbage-cleanup
          EXPECTED_SIZE=58295
          EXPECTED_SHA=88669c6172219d15e8dc296231e39e48f690ac73043c43897b7f220aca0d8561

          git fetch origin preview "$TARGET_BRANCH"
          test "$(git rev-parse origin/preview)" = "$EXPECTED_PREVIEW"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$BASE_HEAD"

          cat .github/clean-rebuild.payload.b64.part{01,02,03,04,05,06,07,08,09,10,11} > /tmp/bug2.b64
          base64 -d /tmp/bug2.b64 > /tmp/bug2.tar.gz
          actual_size="$(wc -c < /tmp/bug2.tar.gz | tr -d ' ')"
          actual_sha="$(sha256sum /tmp/bug2.tar.gz | cut -d' ' -f1)"
          echo "payload size=$actual_size sha256=$actual_sha"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA"

          git reset --hard "$BASE_HEAD"
          git clean -fd
          tar -xzf /tmp/bug2.tar.gz -C .
          git diff --check

          expected="$(printf '%s\n' \
            scripts/check-image-fallback-surfaces.mjs \
            scripts/check-serial-reading-ui.mjs \
            src/app/anime-list-application.ts \
            src/app/feature-types.ts \
            src/data/image-section-service.ts \
            src/data/media-asset-garbage-collector.ts \
            src/data/media-asset-reference-service.ts \
            src/data/media-note-service.ts \
            src/data/vault-scope.ts \
            src/domain/media-asset-cleanup.ts \
            src/domain/media-asset-references.ts \
            src/features/serial-covers/feature.ts \
            src/main.ts \
            src/ui/media-form-contracts.ts \
            src/ui/media-form-controls.ts \
            src/ui/media-modals.ts \
            src/ui/settings.ts \
            tests/contracts/image-section-service.test.ts \
            tests/contracts/media-asset-garbage-collector.test.ts \
            tests/contracts/media-note-service.test.ts \
            tests/contracts/moments-service.test.ts \
            tests/legacy-characterization.test.ts \
            tests/media-asset-cleanup.test.ts \
            tests/media-form-lifecycle.test.ts \
            tests/search-settings.test.ts \
            tests/test-catalog.mjs | sort)"

          git add -N \
            scripts/check-image-fallback-surfaces.mjs \
            scripts/check-serial-reading-ui.mjs \
            src/app/anime-list-application.ts \
            src/app/feature-types.ts \
            src/data/image-section-service.ts \
            src/data/media-asset-garbage-collector.ts \
            src/data/media-asset-reference-service.ts \
            src/data/media-note-service.ts \
            src/data/vault-scope.ts \
            src/domain/media-asset-cleanup.ts \
            src/domain/media-asset-references.ts \
            src/features/serial-covers/feature.ts \
            src/main.ts \
            src/ui/media-form-contracts.ts \
            src/ui/media-form-controls.ts \
            src/ui/media-modals.ts \
            src/ui/settings.ts \
            tests/contracts/image-section-service.test.ts \
            tests/contracts/media-asset-garbage-collector.test.ts \
            tests/contracts/media-note-service.test.ts \
            tests/contracts/moments-service.test.ts \
            tests/legacy-characterization.test.ts \
            tests/media-asset-cleanup.test.ts \
            tests/media-form-lifecycle.test.ts \
            tests/search-settings.test.ts \
            tests/test-catalog.mjs
          actual="$(git diff --name-only "$BASE_HEAD" | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Expected changed files:"
            printf '%s\n' "$expected"
            echo "Actual changed files:"
            printf '%s\n' "$actual"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/domain/media-asset-cleanup.ts \
            src/domain/media-asset-references.ts \
            src/data/media-asset-reference-service.ts \
            src/data/media-asset-garbage-collector.ts \
            src/data/vault-scope.ts \
            src/data/image-section-service.ts \
            src/data/media-note-service.ts
          git commit -m "fix: clean orphaned AnimeList assets"

          git add \
            src/app/anime-list-application.ts \
            src/app/feature-types.ts \
            src/features/serial-covers/feature.ts \
            src/main.ts \
            src/ui/media-form-contracts.ts \
            src/ui/media-form-controls.ts \
            src/ui/media-modals.ts \
            src/ui/settings.ts
          git commit -m "fix: integrate media asset cleanup lifecycle"

          git add \
            scripts/check-image-fallback-surfaces.mjs \
            scripts/check-serial-reading-ui.mjs \
            tests/contracts/image-section-service.test.ts \
            tests/contracts/media-asset-garbage-collector.test.ts \
            tests/contracts/media-note-service.test.ts \
            tests/contracts/moments-service.test.ts \
            tests/legacy-characterization.test.ts \
            tests/media-asset-cleanup.test.ts \
            tests/media-form-lifecycle.test.ts \
            tests/search-settings.test.ts \
            tests/test-catalog.mjs
          git commit -m "test: cover media asset garbage cleanup"

          test -z "$(git status --porcelain)"
          test "$(git rev-list --count "$BASE_HEAD"..HEAD)" = "3"
          actual_final="$(git diff --name-only "$BASE_HEAD"..HEAD | sort)"
          test "$actual_final" = "$expected"

          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
