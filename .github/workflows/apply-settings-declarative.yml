name: Apply declarative settings fix

on:
  push:
    branches:
      - fix/settings-declarative-search

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/settings-declarative-search
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply reviewed patch
        run: |
          git apply --check .github/settings-declarative.patch
          git apply .github/settings-declarative.patch
          rm .github/settings-declarative.patch
          rm .github/workflows/apply-settings-declarative.yml
      - name: Validate exact product tree
        run: |
          npm ci
          npm run check
          npm run release:check
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: expose Settings to Obsidian search"
          git push origin HEAD:fix/settings-declarative-search
