name: Apply garbage cleanup patch

on:
  push:
    branches:
      - fix/filter-tag-clear-all
    paths:
      - .github/garbage-cleanup.patch.b64.part1
      - .github/garbage-cleanup.patch.b64.part2
      - .github/garbage-cleanup.patch.b64.part3
      - .github/garbage-cleanup.patch.b64.part4
      - .github/workflows/apply-garbage-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rebuild clean garbage-cleanup commits
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD=1532e23ec96568f7926df9c55227b97b94e14bfe
          EXPECTED_PREVIEW=86ab2262c4b7a588e676d283e87e4ab4e12506b1
          STAGING_HEAD="$GITHUB_SHA"

          git fetch origin preview
          test "$(git rev-parse origin/preview)" = "$EXPECTED_PREVIEW"

          cat .github/garbage-cleanup.patch.b64.part{1,2,3,4} | base64 -d > /tmp/garbage-cleanup.patch
          test "$(wc -c < /tmp/garbage-cleanup.patch | tr -d ' ')" = "79434"
          test "$(sha256sum /tmp/garbage-cleanup.patch | cut -d' ' -f1)" = "21773e2c3b5d85dd037cabc70172664c42c7302ead6f04713b710ca464379a11"

          git reset --hard "$BASE_HEAD"
          git clean -fd
          git apply --check /tmp/garbage-cleanup.patch
          git apply /tmp/garbage-cleanup.patch
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/domain/media-asset-cleanup.ts \
            src/domain/media-asset-references.ts \
            src/data/media-asset-reference-service.ts \
            src/data/media-asset-garbage-collector.ts \
            src/data/vault-scope.ts \
            src/data/cover-cache.ts \
            src/data/image-section-service.ts \
            src/data/media-note-service.ts
          git commit -m "fix: clean orphaned AnimeList assets"

          git add \
            src/app/anime-list-application.ts \
            src/app/feature-types.ts \
            src/app/serial-covers/serial-cover-service.ts \
            src/features/serial-covers/feature.ts \
            src/main.ts \
            src/ui/media-form-contracts.ts \
            src/ui/media-form-controls.ts \
            src/ui/media-modals.ts \
            src/ui/settings.ts \
            src/i18n/locales/en/core.ts \
            src/i18n/locales/ja/core.ts \
            src/i18n/locales/ko/core.ts \
            src/i18n/locales/zh-TW/core.ts
          git commit -m "fix: integrate media asset cleanup lifecycle"

          git add \
            scripts/check-image-fallback-surfaces.mjs \
            scripts/check-serial-reading-ui.mjs \
            tests/contracts/image-section-service.test.ts \
            tests/contracts/media-asset-garbage-collector.test.ts \
            tests/contracts/media-note-service.test.ts \
            tests/contracts/moments-service.test.ts \
            tests/legacy-characterization.test.ts \
            tests/media-asset-cleanup.test.ts \
            tests/media-form-lifecycle.test.ts \
            tests/search-settings.test.ts \
            tests/test-catalog.mjs
          git commit -m "test: cover media asset garbage cleanup"

          test -z "$(git status --porcelain)"
          test "$(git rev-list --count "$BASE_HEAD"..HEAD)" = "3"

          expected="$(printf '%s\n' \
            scripts/check-image-fallback-surfaces.mjs \
            scripts/check-serial-reading-ui.mjs \
            src/app/anime-list-application.ts \
            src/app/feature-types.ts \
            src/app/serial-covers/serial-cover-service.ts \
            src/data/cover-cache.ts \
            src/data/image-section-service.ts \
            src/data/media-asset-garbage-collector.ts \
            src/data/media-asset-reference-service.ts \
            src/data/media-note-service.ts \
            src/data/vault-scope.ts \
            src/domain/media-asset-cleanup.ts \
            src/domain/media-asset-references.ts \
            src/features/serial-covers/feature.ts \
            src/i18n/locales/en/core.ts \
            src/i18n/locales/ja/core.ts \
            src/i18n/locales/ko/core.ts \
            src/i18n/locales/zh-TW/core.ts \
            src/main.ts \
            src/ui/media-form-contracts.ts \
            src/ui/media-form-controls.ts \
            src/ui/media-modals.ts \
            src/ui/settings.ts \
            tests/contracts/image-section-service.test.ts \
            tests/contracts/media-asset-garbage-collector.test.ts \
            tests/contracts/media-note-service.test.ts \
            tests/contracts/moments-service.test.ts \
            tests/legacy-characterization.test.ts \
            tests/media-asset-cleanup.test.ts \
            tests/media-form-lifecycle.test.ts \
            tests/search-settings.test.ts \
            tests/test-catalog.mjs | sort)"
          actual="$(git diff --name-only "$BASE_HEAD"..HEAD | sort)"
          test "$actual" = "$expected"

          git push --force-with-lease=refs/heads/fix/filter-tag-clear-all:"$STAGING_HEAD" origin HEAD:refs/heads/fix/filter-tag-clear-all
