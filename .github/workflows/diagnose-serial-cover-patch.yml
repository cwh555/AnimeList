name: Inspect staged serial cover patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/serial-cover-picker-and-migration-ui
      - run: |
          mkdir -p staged-patch
          cp .github/serial-cover-final.patch.gz.b64 staged-patch/final.patch.gz.b64
          cp .github/serial-cover-chunk-* staged-patch/ 2>/dev/null || true
          wc -c staged-patch/*
          git hash-object staged-patch/*
      - uses: actions/upload-artifact@v6
        with:
          name: staged-serial-cover-patch
          path: staged-patch
          retention-days: 1
