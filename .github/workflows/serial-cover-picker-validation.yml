name: Stage serial cover picker fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  stage-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check out current fix branch
        run: |
          git fetch origin fix/serial-cover-picker-click
          branch_head="$(git rev-parse origin/fix/serial-cover-picker-click)"
          echo "BRANCH_HEAD=$branch_head" >> "$GITHUB_ENV"
          git checkout -B fix/serial-cover-picker-click origin/fix/serial-cover-picker-click
      - name: Apply explicit Select button and Chromium test
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              assert source.count(old) == 1, f"expected one anchor in {path}"
              path.write_text(source.replace(old, new), encoding="utf-8")

          feature = Path("src/serial-cover-feature.ts")
          replace_once(
              feature,
              'import { SerialCoverLoadQueue } from "./serial-cover-load-queue";\n',
              'import { appendSerialCoverChoice } from "./serial-cover-choice-ui";\nimport { SerialCoverLoadQueue } from "./serial-cover-load-queue";\n',
          )
          replace_once(
              feature,
              '''      for (const candidate of this.candidates) {
        const row = results.createEl("button", {
          cls: `al-search-result${selected?.sourceId === candidate.sourceId ? " is-selected" : ""}`,
        });
        row.type = "button";
        row.setAttribute("aria-pressed", selected?.sourceId === candidate.sourceId ? "true" : "false");
        const image = row.createEl("img");
        image.src = candidate.coverUrl;
        image.alt = candidate.title;
        image.loading = "lazy";
        const body = row.createDiv({ cls: "al-search-result-body" });
        body.createEl("strong", { text: candidate.title });
        body.createEl("span", { text: candidate.provider });
        body.createEl("span", {
          text: serialCoverText("matchScore", { score: Math.round(candidate.score) }),
        });
        row.createSpan({ cls: "al-search-result-use", text: uiText("action.select") });
        row.addEventListener("click", () => {
          this.selection.select(candidate);
          renderResults();
        });
      }
''',
              '''      for (const candidate of this.candidates) {
        appendSerialCoverChoice(results, {
          candidate,
          selected: selected === candidate,
          selectText: uiText("action.select"),
          matchScoreText: serialCoverText("matchScore", { score: Math.round(candidate.score) }),
          onSelect: () => {
            this.selection.select(candidate);
            renderResults();
          },
        });
      }
''',
          )

          Path("src/serial-cover-choice-ui.ts").write_text('''import type { RankedSerialCoverCandidate } from "./serial-entry-cover";

export interface SerialCoverChoiceOptions {
  candidate: RankedSerialCoverCandidate;
  selected: boolean;
  selectText: string;
  matchScoreText: string;
  onSelect: () => void;
}

function elementTarget(value: EventTarget | null): Element | null {
  return value instanceof Element ? value : null;
}

export function appendSerialCoverChoice(parent: HTMLElement, options: SerialCoverChoiceOptions): HTMLDivElement {
  const documentRef = parent.ownerDocument;
  const row = documentRef.createElement("div");
  row.className = `al-search-result${options.selected ? " is-selected" : ""}`;
  row.setAttribute("role", "option");
  row.setAttribute("aria-selected", options.selected ? "true" : "false");
  row.tabIndex = 0;

  const image = documentRef.createElement("img");
  image.src = options.candidate.coverUrl;
  image.alt = options.candidate.title;
  image.loading = "lazy";

  const body = documentRef.createElement("div");
  body.className = "al-search-result-body";
  const title = documentRef.createElement("strong");
  title.textContent = options.candidate.title;
  const provider = documentRef.createElement("span");
  provider.textContent = options.candidate.provider;
  const score = documentRef.createElement("span");
  score.textContent = options.matchScoreText;
  body.append(title, provider, score);

  const selectButton = documentRef.createElement("button");
  selectButton.type = "button";
  selectButton.className = "al-search-result-use";
  selectButton.textContent = options.selectText;

  const choose = (): void => options.onSelect();
  selectButton.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    choose();
  });
  row.addEventListener("click", (event) => {
    if (elementTarget(event.target)?.closest(".al-search-result-use")) return;
    choose();
  });
  row.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    choose();
  });

  row.append(image, body, selectButton);
  parent.appendChild(row);
  return row;
}
''', encoding="utf-8")

          Path("scripts/check-serial-cover-click.mjs").write_text('''import assert from "node:assert/strict";
import { spawnSync } from "node:child_process";
import { createServer } from "node:http";
import { mkdir, readFile, rm, writeFile } from "node:fs/promises";
import path from "node:path";
import process from "node:process";

const root = process.cwd();
const output = path.join(root, ".tmp", "serial-cover-click");
await rm(output, { recursive: true, force: true });
await mkdir(output, { recursive: true });
const tsc = path.join(root, "node_modules", ".bin", process.platform === "win32" ? "tsc.cmd" : "tsc");
const compiled = spawnSync(tsc, ["src/serial-cover-choice-ui.ts", "--target", "ES2022", "--module", "ES2022", "--moduleResolution", "Bundler", "--lib", "ES2022,DOM", "--skipLibCheck", "--rootDir", "src", "--outDir", output], { cwd: root, encoding: "utf8" });
assert.equal(compiled.status, 0, compiled.stderr || compiled.stdout);

await writeFile(path.join(output, "index.html"), `<!doctype html><html><body data-result="pending"><div id="results"></div><button id="apply" type="button" disabled>Apply</button><script type="module">
import { appendSerialCoverChoice } from "./serial-cover-choice-ui.js";
const candidates = [
 { provider: "Bangumi", sourceId: "first", title: "Work (1)", coverUrl: "data:image/gif;base64,R0lGODlhAQABAAAAACw=", infoUrl: "", score: 200 },
 { provider: "Bangumi", sourceId: "second", title: "Work (2)", coverUrl: "data:image/gif;base64,R0lGODlhAQABAAAAACw=", infoUrl: "", score: 190 },
];
const results = document.querySelector("#results");
const apply = document.querySelector("#apply");
let selected = candidates[0];
let applied = "";
function render() {
 results.replaceChildren();
 for (const candidate of candidates) appendSerialCoverChoice(results, { candidate, selected: selected === candidate, selectText: "選用", matchScoreText: `Match ${candidate.score}`, onSelect: () => { selected = candidate; render(); } });
 apply.disabled = !selected;
}
apply.addEventListener("click", () => { applied = selected?.sourceId ?? ""; });
render();
results.querySelectorAll(".al-search-result-use")[1].click();
const secondRow = results.querySelectorAll(".al-search-result")[1];
apply.click();
const passed = selected?.sourceId === "second" && secondRow.classList.contains("is-selected") && secondRow.getAttribute("aria-selected") === "true" && !apply.disabled && applied === "second";
document.body.dataset.result = passed ? "pass" : "fail";
document.body.dataset.selected = selected?.sourceId ?? "";
document.body.dataset.applied = applied;
</script></body></html>`, "utf8");

const browserNames = process.platform === "win32" ? ["chrome.exe", "msedge.exe"] : ["google-chrome-stable", "google-chrome", "chromium", "chromium-browser"];
let browser = "";
for (const name of browserNames) {
 const found = spawnSync(process.platform === "win32" ? "where" : "which", [name], { encoding: "utf8" });
 if (found.status === 0) { browser = found.stdout.trim().split(/\\r?\\n/)[0]; break; }
}
assert.ok(browser, "A Chromium-compatible browser is required for the serial-cover click test.");
const server = createServer(async (request, response) => {
 const pathname = request.url === "/" ? "/index.html" : request.url;
 const file = path.join(output, pathname.replace(/^\\//, ""));
 try {
  const content = await readFile(file);
  response.setHeader("Content-Type", file.endsWith(".js") ? "text/javascript" : "text/html; charset=utf-8");
  response.end(content);
 } catch { response.statusCode = 404; response.end("not found"); }
});
await new Promise((resolve) => server.listen(0, "127.0.0.1", resolve));
const address = server.address();
assert.ok(address && typeof address === "object");
const browserResult = spawnSync(browser, ["--headless=new", "--no-sandbox", "--disable-gpu", "--virtual-time-budget=2000", "--dump-dom", `http://127.0.0.1:${address.port}/`], { encoding: "utf8", timeout: 30000 });
server.close();
await rm(output, { recursive: true, force: true });
assert.equal(browserResult.status, 0, browserResult.stderr || browserResult.stdout);
assert.match(browserResult.stdout, /data-result="pass"/);
assert.match(browserResult.stdout, /data-selected="second"/);
assert.match(browserResult.stdout, /data-applied="second"/);
console.log("Serial cover Select and Apply Chromium click test passed.");
''', encoding="utf-8")

          package_path = Path("package.json")
