name: Branch version sync

on:
  push:
    branches:
      - fix/masterpiece-warnings-release-1.5.2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/masterpiece-warnings-release-1.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync derived version metadata
        run: node scripts/version-bump.mjs
      - name: Commit derived metadata
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json manifest.json versions.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json manifest.json versions.json
          git commit -m "chore: sync 1.5.2 version metadata"
          git push origin HEAD:fix/masterpiece-warnings-release-1.5.2
