name: Clean temporary timeline style branches

on:
  pull_request:
    branches: [preview]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'tmp/generate-timeline-cover-styles'
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/timeline-cover-style-output" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/generate-timeline-cover-styles"
