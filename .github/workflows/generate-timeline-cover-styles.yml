name: Generate timeline cover stylesheet

on:
  push:
    branches: [tmp/generate-timeline-cover-styles]
  pull_request:
    branches: [preview]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/timeline-cover-fit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run styles:build
      - run: npm run test:feature -- styles
      - name: Commit generated stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && { echo "Expected styles.css to change"; exit 1; }
          git commit -m "build: update timeline stylesheet bundle"
          git push origin HEAD:feature/timeline-cover-fit
