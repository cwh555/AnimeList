name: Validate and publish serial cover direct card apply v2
run-name: Validate direct card apply with original-title ranking

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/serial-cover-direct-card-apply
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply exact product patches
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_FEATURE=2bb9d2d2855c55a4619b4d3abbadd08271144d5c
          git fetch origin feature/serial-entry-covers fix/serial-cover-direct-card-apply
          test "$(git rev-parse origin/feature/serial-entry-covers)" = "$EXPECTED_FEATURE"
          test "$(git merge-base HEAD origin/feature/serial-entry-covers)" = "$EXPECTED_FEATURE"
          cat .github/direct-apply-patch/chunk-0[0-3] > /tmp/direct-apply.patch.gz.b64
          echo "4fdb411e4371783b7386ee70a29fdf35b035e18791c7dcbfdc8295614bf79007  /tmp/direct-apply.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/direct-apply.patch.gz.b64 | gzip --decompress > /tmp/direct-apply.patch
          echo "92902f9dbd1ccbcb2de38c109202dea201c905b08052a453a61cc71efadd9fc3  /tmp/direct-apply.patch" | sha256sum --check
          patch -p1 < /tmp/direct-apply.patch
          echo "d5aa4cd5ecfc265cc945eade65ded8f205c9d8667461f9ccd8366c4ebf5a9532  .github/direct-apply-patch/reference-title.patch.gz.b64" | sha256sum --check
          base64 --decode .github/direct-apply-patch/reference-title.patch.gz.b64 | gzip --decompress > /tmp/reference-title.patch
          echo "7ea0e93fb1963103449341b77a5e4ff96e54992674a99131b91eb571ab0d8b9e  /tmp/reference-title.patch" | sha256sum --check
          patch -p1 < /tmp/reference-title.patch
      - run: npm ci
      - run: npm run check
      - run: npm run test:browser
      - run: npm run release:check
      - name: Build production Test Vault
        env:
          ANIMELIST_TEST_VAULT_NO_OPEN: "1"
        run: npm run test-vault
      - name: Run live Bangumi probes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { build } from "esbuild";
          await build({
            entryPoints: [".github/direct-apply-patch/live-probe.ts"],
            outfile: "/tmp/serial-cover-live-probe.mjs",
            bundle: true,
            platform: "node",
            format: "esm",
            target: "node24",
            plugins: [{
              name: "obsidian-live-stub",
              setup(build) {
                build.onResolve({ filter: /^obsidian$/ }, () => ({
                  path: process.cwd() + "/.github/direct-apply-patch/obsidian-live-stub.ts",
                  namespace: "file",
                }));
              },
            }],
          });
          NODE
          node /tmp/serial-cover-live-probe.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: serial-cover-direct-apply-live-report-v2
          path: serial-cover-live-report.json
          retention-days: 7
      - name: Publish validated product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f serial-cover-live-report.json
          rm -rf .github/direct-apply-patch
          rm -f .github/workflows/validate-serial-cover-direct-apply.yml
          rm -f .github/workflows/validate-serial-cover-direct-apply-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply serial covers directly from search cards"
          git push origin HEAD:fix/serial-cover-direct-card-apply
